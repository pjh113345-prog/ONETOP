<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>원탑 2학년 영어II 3·4과 · 올림포스 고2 시험</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* Layout: one-screen phone game. Start = name + five test cards; game = HUD, timer, question card, choices (or chunk tray for 순서배열). Navy ink with a stamp-red accent, the 원탑 house look. */
:root{
  --bg:#f3f4f8; --surface:#ffffff; --surface-2:#e8eaf2; --ink:#1b2140; --muted:#5d6482;
  --line:#d3d7e5; --accent:#2f4ad0; --accent-ink:#ffffff; --stamp:#d8382c;
  --good:#1c9a57; --good-bg:#e1f5ea; --bad:#d8382c; --bad-bg:#fbe5e2; --warn:#ef7d16;
  --gold:#d79b00; --shadow:0 1px 2px rgba(27,33,64,.08),0 4px 14px rgba(27,33,64,.06); --on-color:#ffffff;
  --f-display:"Black Han Sans","Noto Sans KR",system-ui,sans-serif;
  --f-body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-en:"Source Serif 4",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10132a; --surface:#1a1e3b; --surface-2:#252a4d; --ink:#eef0fb; --muted:#a3a9c9;
  --line:#343a63; --accent:#7d90ff; --accent-ink:#0c0f24; --stamp:#ff6b5e;
  --good:#3fd387; --good-bg:#173b2c; --bad:#ff6b5e; --bad-bg:#47201f; --warn:#ffa043;
  --gold:#ffcc4d; --shadow:0 1px 2px rgba(0,0,0,.4); --on-color:#0c0f24; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10132a; --surface:#1a1e3b; --surface-2:#252a4d; --ink:#eef0fb; --muted:#a3a9c9;
  --line:#343a63; --accent:#7d90ff; --accent-ink:#0c0f24; --stamp:#ff6b5e;
  --good:#3fd387; --good-bg:#173b2c; --bad:#ff6b5e; --bad-bg:#47201f; --warn:#ffa043;
  --gold:#ffcc4d; --shadow:0 1px 2px rgba(0,0,0,.4); --on-color:#0c0f24; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;word-break:keep-all;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
.wrap{max-width:580px;margin:0 auto;padding-block:8px 150px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--f-display);font-weight:400;letter-spacing:.01em;margin:0;text-wrap:balance}
h2{font-size:20px}

.brand{display:flex;align-items:center;gap:10px;margin:6px 0 14px}
.stampmark{width:42px;height:42px;border-radius:50%;border:3px solid var(--stamp);color:var(--stamp);display:grid;place-items:center;font-family:var(--f-display);font-size:18px;transform:rotate(-12deg);flex:none}
.brand h1{font-size:25px;line-height:1.15}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);display:grid;gap:14px;min-width:0}
.lbl{font-weight:700;font-size:14px;display:block;margin-bottom:6px}
input.txt{width:100%;font:inherit;font-size:17px;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.tests{display:grid;gap:7px}
.books{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.book{padding:12px 6px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font-weight:700;font-size:15px;cursor:pointer}
.book[aria-checked="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.resume{border:2px solid var(--accent);display:grid;gap:6px}.resume.pen{border-color:var(--bad)}.resume p{margin:0}.rbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}.rbtns .btn:only-child{grid-column:span 2}
.when{margin:10px 0 2px;padding:9px 12px;border-radius:10px;background:var(--surface-2);font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}.when b{font-size:17px;margin-left:4px}
.test{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center;text-align:left;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);cursor:pointer}
.test .num{grid-row:span 2;font-family:var(--f-display);font-size:22px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--muted)}
.test b{font-size:16px}
.test small{grid-column:2;color:var(--muted);font-size:13px}
.test .meta{grid-row:span 2;grid-column:3;font-size:12px;font-weight:700;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;line-height:1.3}
.test.pen{border-style:dashed}.test.pen .num{background:var(--bad-bg);color:var(--bad)}.test.pen[aria-checked="true"]{border-color:var(--bad)}.test.pen[aria-checked="true"] .num{background:var(--bad);color:var(--on-color)}
.test[aria-checked="true"]{border-color:var(--accent);background:var(--surface)}
.test[aria-checked="true"] .num{background:var(--accent);color:var(--accent-ink)}
.rules{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:14px;color:var(--muted)}
.rules b{color:var(--ink)}
.passrule,.passrule b{color:var(--stamp)}
.toggle{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--bg);font-weight:500;width:100%;text-align:left}
.toggle .sw{width:40px;height:24px;border-radius:12px;background:var(--surface-2);position:relative;flex:none;transition:background .2s}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
.toggle[aria-pressed="true"] .sw{background:var(--accent)}
.toggle[aria-pressed="true"] .sw::after{transform:translateX(16px);background:var(--accent-ink)}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:900;font-size:18px;cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:var(--surface-2);color:var(--ink);font-size:16px}
.hint{font-size:13px;color:var(--muted);margin:0}

.hud{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 0 6px}
.hud .prog{font-weight:700;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hud .score{font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums}
.combo{font-family:var(--f-display);font-size:17px;padding:2px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);visibility:hidden}
.combo.on{visibility:visible}
.combo.c3{background:var(--warn);color:var(--on-color)}
.combo.c5{background:var(--stamp);color:var(--on-color);animation:beat .5s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.timer{height:9px;border-radius:5px;background:var(--surface-2);overflow:hidden;margin-bottom:8px}
.timer i{display:block;height:100%;width:100%;background:var(--accent);border-radius:5px;transform-origin:left}
.timer.low i{background:var(--stamp)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);margin-bottom:8px;position:relative;min-width:0}
.kind{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--accent);margin-bottom:4px}
.prompt{font-size:17px;font-weight:500;overflow-wrap:anywhere}
.prompt.big{font-family:var(--f-display);font-weight:400;font-size:30px;text-align:center;padding:10px 0 6px;line-height:1.2}
.prompt.en{font-family:var(--f-en);font-weight:600;font-size:31px}
.prompt.ko{font-family:var(--f-body);font-weight:900;font-size:24px}
.prompt .pos{display:block;font-family:var(--f-body);font-size:13px;font-weight:700;color:var(--muted);margin-top:2px}
.prompt.sent{font-family:var(--f-en);font-size:19px;line-height:1.55;font-weight:500}
.prompt .oxs.ok{color:var(--good);font-weight:900;border-bottom:2.5px solid var(--good)}.prompt .oxs.no{color:var(--bad);font-weight:900}.prompt .oxs.no s{opacity:.7}
.prompt .gap{display:inline-block;min-width:4.2em;border-bottom:2.5px solid var(--accent);margin:0 2px;color:var(--accent);font-weight:900;text-align:center;font-family:var(--f-body)}
.prompt .ko-hint{display:block;font-family:var(--f-body);font-size:14px;color:var(--muted);margin-top:8px;font-weight:400;line-height:1.45}
.pt{display:inline-block;font-family:var(--f-body);font-size:12px;font-weight:700;padding:1px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted);margin-left:4px}
.opts{display:grid;gap:7px}
.opt{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);font-size:17px;font-weight:500;cursor:pointer;min-height:50px;overflow-wrap:anywhere;transition:transform .08s}
.opt:active{transform:scale(.98)}
.opt .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:13px;font-weight:900;color:var(--muted);font-family:var(--f-body)}
.opt .en{font-family:var(--f-en);font-weight:600;font-size:19px}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.right .n{background:var(--good);color:var(--on-color)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .n{background:var(--bad);color:var(--on-color)}
.opt:disabled{cursor:default}

/* 순서배열 */
.ko-q{font-weight:700;font-size:17px;line-height:1.5}
.tray{min-height:96px;border:2px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;margin-bottom:8px;background:var(--surface)}
.tray.empty::before{content:"아래 조각을 순서대로 누르세요";color:var(--muted);font-size:14px;padding:4px}
.bank{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{font-family:var(--f-en);font-size:17px;font-weight:500;padding:7px 11px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;line-height:1.25;max-width:100%;overflow-wrap:anywhere}
.chip:active{transform:scale(.97)}
.tray .chip{background:var(--surface-2);border-color:transparent}
.bank .chip.used{visibility:hidden}
.ordbtns{display:grid;grid-template-columns:1fr 2fr;gap:8px}
.fb{border-radius:12px;padding:10px 12px;font-size:15px;display:grid;gap:4px;margin-bottom:8px}
.fb.ok{background:var(--good-bg);color:var(--good);font-weight:700}
.fb.no{background:var(--bad-bg)}
.fb .h{color:var(--bad);font-weight:900}
.fb .en{font-family:var(--f-en);color:var(--ink);font-size:16px}
.fb .mine{font-family:var(--f-en);color:var(--muted);font-size:15px;text-decoration:line-through}

.float{position:absolute;right:14px;top:6px;font-family:var(--f-display);font-size:26px;color:var(--good);pointer-events:none;animation:up .9s ease-out forwards}
@keyframes up{from{opacity:0;transform:translateY(16px)}20%{opacity:1}to{opacity:0;transform:translateY(-34px)}}
.cheer{position:fixed;left:0;right:0;top:28%;text-align:center;font-family:var(--f-display);font-size:34px;color:var(--stamp);pointer-events:none;animation:pop 1.2s ease-out forwards;z-index:30;text-shadow:0 2px 0 var(--surface)}
@keyframes pop{0%{opacity:0;transform:scale(.5)}20%{opacity:1;transform:scale(1.15)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
#flash{position:fixed;inset:0;background:var(--bad);opacity:0;pointer-events:none;z-index:20}
#flash.go{animation:flash .45s ease-out}
@keyframes flash{0%{opacity:.35}100%{opacity:0}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:25;width:100%;height:100%}

.grade{display:flex;align-items:center;gap:16px}
.grade .g{font-family:var(--f-display);font-size:52px;line-height:1;width:78px;height:78px;border-radius:50%;border:5px solid currentColor;display:grid;place-items:center;transform:rotate(-10deg);flex:none}
.g-S{color:var(--gold)}.g-A{color:var(--good)}.g-B{color:var(--accent)}.g-C{color:var(--warn)}.g-D{color:var(--stamp)}
.which{font-size:13px;font-weight:700;color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--bg);border-radius:10px;padding:8px;text-align:center;min-width:0}
.stat b{display:block;font-family:var(--f-display);font-weight:400;font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.pass{display:flex;align-items:center;gap:12px;border-radius:12px;padding:12px 14px;background:var(--good-bg);color:var(--good);border:2px solid var(--good)}
.pass.fail{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.pass .big{font-family:var(--f-display);font-size:34px;line-height:1;flex:none}
.pass p{margin:0;font-size:14px;font-weight:700;color:var(--ink)}
.copyline{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px!important}
.cnt{display:block;font-size:12px;font-weight:700;color:var(--bad);margin-bottom:2px}
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.list li{padding:9px 2px;border-bottom:1px solid var(--line);display:grid;gap:3px;font-size:15px;min-width:0}
.list li b{overflow-wrap:anywhere}
.list .en{font-family:var(--f-en);font-size:16px}
.list .sub{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.list u{text-decoration-color:var(--accent);text-decoration-thickness:2px;font-weight:600}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;transition:none!important}}

/* 오답 노트 시험지 (화면 미리보기 + 인쇄) */
textarea.txt{width:100%;font:inherit;font-size:14px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);resize:vertical;min-height:140px}
.linkbtn{display:block;margin:6px auto 0;background:none;border:0;color:var(--muted);text-decoration:underline;font:inherit;font-size:14px;padding:10px;cursor:pointer}
.sbar{display:grid;gap:8px}
.sheets{display:grid;gap:14px;margin-top:12px}
.sheet{background:#fff;color:#141414;border-radius:8px;padding:20px 18px;font-size:14px;line-height:1.5;box-shadow:var(--shadow);min-width:0;overflow-wrap:anywhere}
.shead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-bottom:2px solid #141414;padding-bottom:6px;margin-bottom:8px;font-size:15px}
.sinfo{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;margin-bottom:6px}
.ssec h3{font-size:14px;margin:12px 0 4px;padding:4px 8px;background:#eef0f5;border-left:4px solid #2f4ad0}
.ssec h3 small{font-weight:400;color:#444;margin-left:4px}
.sq{break-inside:avoid;padding:6px 0 8px;border-bottom:1px dotted #bbb}
.sq p{margin:0}
.sen{font-family:var(--f-en)}
.sopts{list-style:none;margin:4px 0 0;padding:0 0 0 14px;display:grid;grid-template-columns:1fr 1fr;gap:2px 14px}
.stag{font-size:11px;color:#b3261e;border:1px solid #b3261e;border-radius:4px;padding:0 4px;margin-left:4px;white-space:nowrap}
.schunks{margin:5px 0 4px!important;padding:6px 8px;background:#f2f3f7;border-radius:4px;font-family:var(--f-en)}
.sline{border-bottom:1px solid #999;height:24px}
.keys{list-style:none;padding:0;margin:0;columns:2;column-gap:22px;font-size:13px}
.keys li{break-inside:avoid;padding:2px 0}
@media (max-width:440px){.sopts{grid-template-columns:1fr}}
@media print{
  @page{size:A4;margin:12mm}
  html,body{background:#fff!important}
  .noprint,#fx,#flash{display:none!important}
  #app{max-width:none!important;padding:0!important;margin:0!important}
  .sheets{display:block;margin:0}
  .sheet{box-shadow:none;padding:0;border-radius:0;break-after:page}
  .sopts{grid-template-columns:1fr 1fr!important}
}
</style>

<div id="flash"></div>
<canvas id="fx"></canvas>
<main class="wrap" id="app"></main>

에서 많은 개인적인 선택을 한다.","id":1},{"lesson":"3","sent":"However, there are many ___ where we must make decisions as a group.","answer":"situations","wrong":["stations","salvations","sanitations"],"ko":"하지만, 우리가 집단으로서 결정을 내려야 하는 상황들이 많이 있다.","id":2},{"lesson":"3","sent":"Group decision-making is not as simple as our personal choices, as it ___ numerous voices with differing opinions.","answer":"involves","wrong":["evolves","resolves","revolves"],"ko":"집단 의사 결정은 다른 의견을 가진 수많은 목소리를 수반하기 때문에 우리의 개인적인 선택들만큼 간단하지 않다.","id":3},{"lesson":"3","sent":"Group decision-making is not as simple as our personal choices, as it involves ___ voices with differing opinions.","answer":"numerous","wrong":["humorous","numerical","nervous"],"ko":"집단 의사 결정은 다른 의견을 가진 수많은 목소리를 수반하기 때문에 우리의 개인적인 선택들만큼 간단하지 않다.","id":4},{"lesson":"3","sent":"Voting is often used to make group decisions fairer and more ___, and various voting methods have been developed over time.","answer":"efficient","wrong":["sufficient","deficient","proficient"],"ko":"투표는 흔히 집단 의사 결정을 더 공정하고 더 효율적으로 만들기 위해 사용되며, 시간이 흐르면서 다양한 투표 방법이 개발되어 왔다.","id":5},{"lesson":"3","sent":"The following story ___ how these different voting methods work.","answer":"illustrates","wrong":["imitates","eliminates","isolates"],"ko":"다음 이야기는 이러한 다양한 투표 방법이 어떻게 적용되는지 보여준다.","id":6},{"lesson":"3","sent":"The members of the Greenville High School student ___ needed to decide how to raise money for children in need.","answer":"council","wrong":["counsel","consul","console"],"ko":"Greenville 고등학교 학생 자치회의 구성원들은 어려움에 처한 아이들을 위해 모금할 방법을 결정해야 했다.","id":7},{"lesson":"3","sent":"Their three options were an art show, a bake sale, and a charity concert, but there were ___ opinions.","answer":"conflicting","wrong":["confirming","conforming","comforting"],"ko":"그들의 세 가지 선택지는 미술 전시회, 빵 바자회, 그리고 자선 콘서트였지만, 상충되는 의견들이 있었다.","id":8},{"lesson":"3","sent":"When they asked for advice from Ms. Akers, the council's advisor, she ___ them not to use the familiar voting method, but to try something different instead.","answer":"encouraged","wrong":["discouraged","encountered","endangered"],"ko":"그들이 자치회의 고문 교사인 Akers 선생님에게 조언을 구했을 때, 그녀는 익숙한 투표 방법을 사용하지 말고, 대신 다른 것을 시도해 보라고 권장했다.","id":9},{"lesson":"3","sent":"The entire council was curious to find out if the different methods would ___ different results.","answer":"yield","wrong":["wield","shield","yell"],"ko":"모든 자치회 구성원들은 각각 다른 방법이 서로 다른 결과를 낼지 궁금해했다.","id":10},{"lesson":"3","sent":"The entire council was ___ to find out if the different methods would yield different results.","answer":"curious","wrong":["furious","cautious","various"],"ko":"모든 자치회 구성원들은 각각 다른 방법이 서로 다른 결과를 낼지 궁금해했다.","id":11},{"lesson":"3","sent":"On the day of the vote, each possible event was given a letter: \"art show\" was ___ by the letter A, the letter B indicated \"bake sale,\" and C stood for \"charity concert.\"","answer":"represented","wrong":["presented","repented","resented"],"ko":"투표 당일, 각각의 가능한 행사에 글자가 하나씩 부여되었다. '미술 전시회'는 글자 A로 표시되었고, 글자 B는 '빵 바자회'를 나타냈으며, C는 '자선 콘서트'를 의미했다.","id":12},{"lesson":"3","sent":"On the day of the vote, each possible event was given a letter: \"art show\" was represented by the letter A, the letter B ___ \"bake sale,\" and C stood for \"charity concert.\"","answer":"indicated","wrong":["dedicated","implicated","indicted"],"ko":"투표 당일, 각각의 가능한 행사에 글자가 하나씩 부여되었다. '미술 전시회'는 글자 A로 표시되었고, 글자 B는 '빵 바자회'를 나타냈으며, C는 '자선 콘서트'를 의미했다.","id":13},{"lesson":"3","sent":"Each of the 20 council members was given a voting slip and instructed to write down the options in order of ___.","answer":"preference","wrong":["reference","inference","conference"],"ko":"20명의 자치회 구성원들 각각은 투표용지를 받았고, 선호하는 순서대로 선택지를 적으라는 지시를 받았다.","id":14},{"lesson":"3","sent":"Each of the 20 council members was given a voting slip and ___ to write down the options in order of preference.","answer":"instructed","wrong":["constructed","obstructed","instilled"],"ko":"20명의 자치회 구성원들 각각은 투표용지를 받았고, 선호하는 순서대로 선택지를 적으라는 지시를 받았다.","id":15},{"lesson":"3","sent":"Neither the second nor third preference matters at all, so they are ___.","answer":"ignored","wrong":["ignited","inspired","imitated"],"ko":"2지망도 3지망도 둘 다 전혀 중요하지 않으므로, 그것들은 무시된다.","id":16},{"lesson":"3","sent":"This method is commonly used in ___ elections around the world.","answer":"political","wrong":["polite","poetical","practical"],"ko":"이 방식은 전 세계 정치 선거에서 흔히 사용된다.","id":17},{"lesson":"3","sent":"The student council quickly ___ that the winner would be option C, the charity concert.","answer":"determined","wrong":["denied","deterred","detained"],"ko":"학생 자치회는 빠르게 자선 콘서트인 선택지 C가 승자가 될 것임을 알아냈다.","id":18},{"lesson":"3","sent":"The FPTP method is uncomplicated and easy to understand, but it has a significant ___.","answer":"weakness","wrong":["strength","witness","wellness"],"ko":"FPTP 방식은 복잡하지 않고 이해하기 쉽지만, 상당한 약점을 가지고 있다.","id":19},{"lesson":"3","sent":"The FPTP method is ___ and easy to understand, but it has a significant weakness.","answer":"uncomplicated","wrong":["complicated","uncompleted","uncomfortable"],"ko":"FPTP 방식은 복잡하지 않고 이해하기 쉽지만, 상당한 약점을 가지고 있다.","id":20},{"lesson":"3","sent":"It is possible to win a vote without the support of the ___.","answer":"majority","wrong":["minority","maturity","priority"],"ko":"과반수의 지지 없이도 투표에서 승리하는 것이 가능하다.","id":21},{"lesson":"3","sent":"However, only 8 out of 20 council members chose the charity concert as their first preference, which ___ 40% of the total votes.","answer":"equaled","wrong":["equipped","exceeded","erased"],"ko":"하지만 20명의 자치회 구성원 중 8명만이 1지망으로 자선 콘서트를 골랐는데, 이는 전체 표의 40%에 해당했다.","id":22},{"lesson":"3","sent":"Next, the council members ___ the votes using the AV method, and they soon realized that there would be a different result.","answer":"examined","wrong":["exclaimed","exhausted","exempted"],"ko":"다음으로, 자치회 구성원들은 AV 방식을 사용하여 표를 검토했고, 그들은 곧 다른 결과가 나올 것이라는 것을 깨달았다.","id":23},{"lesson":"3","sent":"The AV method can ___ include more than one round of counting.","answer":"potentially","wrong":["patiently","partially","permanently"],"ko":"AV 방식은 잠재적으로 한 차례 이상의 집계를 포함할 수 있다.","id":24},{"lesson":"3","sent":"As the charity concert only received 40% of the total votes, a second round of counting was ___.","answer":"required","wrong":["acquired","inquired","retired"],"ko":"자선 콘서트는 전체 표의 40%만을 받았기 때문에, 2차 집계가 필요했다.","id":25},{"lesson":"3","sent":"Therefore, option A was ___, and the 5 council members' votes were redistributed based on their second preferences.","answer":"eliminated","wrong":["illuminated","estimated","nominated"],"ko":"따라서 선택지 A는 제거되었고, 5명의 자치회 구성원들의 표가 그들의 두 번째 선호도에 따라 재분배되었다.","id":26},{"lesson":"3","sent":"Therefore, option A was eliminated, and the 5 council members' votes were ___ based on their second preferences.","answer":"redistributed","wrong":["contributed","rediscovered","distracted"],"ko":"따라서 선택지 A는 제거되었고, 5명의 자치회 구성원들의 표가 그들의 두 번째 선호도에 따라 재분배되었다.","id":27},{"lesson":"3","sent":"It sometimes allows second-preference votes to have a greater ___ than first-preference votes.","answer":"influence","wrong":["affluence","confluence","inference"],"ko":"그것은 때때로 2지망 표가 1지망 표보다 더 큰 영향력을 갖게 하기도 한다.","id":28},{"lesson":"3","sent":"This method involves ___ the voters' preferences between each possible pair of options.","answer":"comparing","wrong":["competing","compiling","completing"],"ko":"이 방식은 가능한 선택지 쌍에 대한 투표자들의 선호도를 비교하는 것을 수반한다.","id":29},{"lesson":"3","sent":"Through this method, the student council ___ that its members preferred option A to option B by a count of 11 to 9.","answer":"discovered","wrong":["recovered","discarded","dissolved"],"ko":"이 방식을 통해, 학생 자치회는 구성원들이 11대 9로 선택지 B보다 선택지 A를 선호한다는 사실을 발견했다.","id":30},{"lesson":"3","sent":"The Condorcet method's weakness is that, along with being complex, it sometimes ___ to select a winner.","answer":"fails","wrong":["fades","files","folds"],"ko":"콩도르세 방식의 약점은 복잡하다는 것과 더불어 때때로 승자를 가려내지 못한다는 점이다.","id":31},{"lesson":"3","sent":"This is especially true in elections that ___ numerous options.","answer":"contain","wrong":["obtain","retain","detain"],"ko":"이는 많은 선택지를 포함하는 선거에서 특히 그렇다.","id":32},{"lesson":"3","sent":"It is possible that no option will be clearly ___ over the others.","answer":"preferred","wrong":["prevented","proffered","referred"],"ko":"어떤 선택지도 다른 선택지들보다 명확하게 선호되지 않을 수 있다.","id":33},{"lesson":"3","sent":"Instead of all methods pointing toward a single option and making the council's choice easier, the winner ___ with each method.","answer":"differed","wrong":["deferred","offered","suffered"],"ko":"모든 방식이 하나의 선택지를 가리키고 자치회의 선택을 더 쉽게 만드는 대신, 각 방식마다 승자는 달랐다.","id":34},{"lesson":"3","sent":"After a long, ___ discussion with Ms. Akers, the student council members decided to choose the Condorcet method, as they liked the idea of directly comparing each option with the others.","answer":"intense","wrong":["immense","intact","innocent"],"ko":"Akers 선생님과의 오랜 열정적인 논의 끝에, 학생 자치회 구성원들은 콩도르세 방식을 선택하기로 결정했는데, 각 선택지를 다른 선택지들과 직접적으로 비교한다는 점이 마음에 들었기 때문이다.","id":35},{"lesson":"3","sent":"No voting system is flawless or clearly ___ to another.","answer":"superior","wrong":["exterior","junior","ulterior"],"ko":"어떤 투표 시스템도 완벽하거나 다른 시스템보다 명백히 우수하지는 않다.","id":36},{"lesson":"3","sent":"No voting system is ___ or clearly superior to another.","answer":"flawless","wrong":["lawless","fearless","flawed"],"ko":"어떤 투표 시스템도 완벽하거나 다른 시스템보다 명백히 우수하지는 않다.","id":37},{"lesson":"3","sent":"Others continue to develop and test new ways of voting, arguing that more complex methods ___ more accurate results.","answer":"deliver","wrong":["deliberate","devour","deprive"],"ko":"다른 사람들은 더 복잡한 방식이 더 정확한 결과를 가져온다고 주장하며 계속해서 새로운 투표 방법을 개발하고 시험한다.","id":38},{"lesson":"3","sent":"All of these efforts are ___ not to make decision-making difficult and inefficient, but to help us make better decisions as a society.","answer":"designed","wrong":["destined","desired","resigned"],"ko":"이러한 모든 노력은 의사 결정을 어렵고 비효율적으로 만들기 위한 것이 아니라, 우리가 집단으로서 더 나은 의사 결정을 내릴 수 있게 돕기 위해 고안된 것이다.","id":39},{"lesson":"3","sent":"Ultimately, understanding all of the possible voting methods and ___ their pros and cons allows us to better understand the process of decision-making.","answer":"weighing","wrong":["weaving","wearing","waiving"],"ko":"결국, 모든 가능한 투표 방법을 이해하고 장단점을 따져 보는 것은 우리가 의사 결정 과정을 더 잘 이해할 수 있게 한다.","id":40}],"gram":[{"lesson":"3","sent":"Group decision-making is not as simple as our personal choices, as it involves numerous voices with ___ opinions.","answer":"differing","wrong":["differed","differ","to differ"],"ko":"집단 의사 결정은 다른 의견을 가진 수많은 목소리를 수반하기 때문에 우리의 개인적인 선택들만큼 간단하지 않다.","point":"분사 수식(능동/수동)","id":1},{"lesson":"3","sent":"Voting is often used to make group decisions fairer and more efficient, and various voting methods ___ developed over time.","answer":"have been","wrong":["have","has been","having been"],"ko":"투표는 흔히 집단 의사 결정을 더 공정하고 더 효율적으로 만들기 위해 사용되며, 시간이 흐르면서 다양한 투표 방법이 개발되어 왔다.","point":"수동태 심화","id":2},{"lesson":"3","sent":"The following story illustrates ___.","answer":"how these different voting methods work","wrong":["how do these different voting methods work","how work these different voting methods","these different voting methods how work"],"ko":"다음 이야기는 이러한 다양한 투표 방법이 어떻게 적용되는지 보여준다.","point":"명사절 접속사/간접의문문","id":3},{"lesson":"3","sent":"Their three options were an art show, a bake sale, and a charity concert, but there were ___ opinions.","answer":"conflicting","wrong":["conflict","conflicts","to conflict"],"ko":"그들의 세 가지 선택지는 미술 전시회, 빵 바자회, 그리고 자선 콘서트였지만, 상충되는 의견들이 있었다.","point":"분사 수식(능동/수동)","id":4},{"lesson":"3","sent":"When they asked for advice from Ms. Akers, the council's advisor, she encouraged them not ___ the familiar voting method, but to try something different instead.","answer":"to use","wrong":["use","using","used"],"ko":"그들이 자치회의 고문 교사인 Akers 선생님에게 조언을 구했을 때, 그녀는 익숙한 투표 방법을 사용하지 말고, 대신 다른 것을 시도해 보라고 권장했다.","point":"5형식 목적격보어 to-v","id":5},{"lesson":"3","sent":"When they asked for advice from Ms. Akers, the council's advisor, she encouraged them not to use the familiar voting method, but ___ something different instead.","answer":"to try","wrong":["trying","tried","tries"],"ko":"그들이 자치회의 고문 교사인 Akers 선생님에게 조언을 구했을 때, 그녀는 익숙한 투표 방법을 사용하지 말고, 대신 다른 것을 시도해 보라고 권장했다.","point":"병렬구조","id":6},{"lesson":"3","sent":"The entire council was curious to find out ___ the different methods would yield different results.","answer":"if","wrong":["what","which","whose"],"ko":"모든 자치회 구성원들은 각각 다른 방법이 서로 다른 결과를 낼지 궁금해했다.","point":"명사절 접속사/간접의문문","id":7},{"lesson":"3","sent":"On the day of the vote, each possible event ___ a letter: \"art show\" was represented by the letter A, the letter B indicated \"bake sale,\" and C stood for \"charity concert.\"","answer":"was given","wrong":["gave","was giving","has given"],"ko":"투표 당일, 각각의 가능한 행사에 글자가 하나씩 부여되었다. '미술 전시회'는 글자 A로 표시되었고, 글자 B는 '빵 바자회'를 나타냈으며, C는 '자선 콘서트'를 의미했다.","point":"수동태 심화","id":8},{"lesson":"3","sent":"Each of the 20 council members was given a voting slip and instructed ___ down the options in order of preference.","answer":"to write","wrong":["write","writing","written"],"ko":"20명의 자치회 구성원들 각각은 투표용지를 받았고, 선호하는 순서대로 선택지를 적으라는 지시를 받았다.","point":"수동태 심화","id":9},{"lesson":"3","sent":"Each of the 20 council members ___ given a voting slip and instructed to write down the options in order of preference.","answer":"was","wrong":["were","being","have"],"ko":"20명의 자치회 구성원들 각각은 투표용지를 받았고, 선호하는 순서대로 선택지를 적으라는 지시를 받았다.","point":"수일치 심화","id":10},{"lesson":"3","sent":"For example, if the charity concert was their first choice, ___ by the bake sale and the art show, they would write CBA.","answer":"followed","wrong":["following","follows","to follow"],"ko":"예를 들어, 자선 콘서트가 첫 번째 선택이고 빵 바자회와 미술 전시회가 뒤따른다면, 그들은 CBA를 적을 것이다.","point":"분사구문","id":11},{"lesson":"3","sent":"For example, if the charity concert was their first choice, followed by the bake sale and the art show, they ___ write CBA.","answer":"would","wrong":["will","would have","had"],"ko":"예를 들어, 자선 콘서트가 첫 번째 선택이고 빵 바자회와 미술 전시회가 뒤따른다면, 그들은 CBA를 적을 것이다.","point":"가정법 과거","id":12},{"lesson":"3","sent":"After every member ___ voted, the voting slips were counted.","answer":"had","wrong":["has","have","having"],"ko":"모든 구성원이 투표를 마친 후, 투표용지가 집계되었다.","point":"시제 심화","id":13},{"lesson":"3","sent":"The FPTP method is ___ of the three methods.","answer":"the simplest","wrong":["the simpler","more simple","the most simply"],"ko":"FPTP 방식은 세 가지 방식 중 가장 간단하다.","point":"비교구문","id":14},{"lesson":"3","sent":"Voters are given several options, and ___ gets the most first-preference votes wins.","answer":"whichever","wrong":["which","that","whomever"],"ko":"투표자들에게는 여러 가지 선택지가 주어지고, 어떤 것이든 가장 많은 1지망 표를 얻은 것이 이긴다.","point":"복합관계사","id":15},{"lesson":"3","sent":"This was because it received 8 first-preference votes, ___ option A received 5 and option B received 7.","answer":"while","wrong":["during","despite","because of"],"ko":"이는 선택지 A는 5표, 선택지 B는 7표를 받은 반면, 그것은 8표의 1지망 표를 받았기 때문이었다.","point":"접속사 vs 전치사","id":16},{"lesson":"3","sent":"It is possible ___ a vote without the support of the majority.","answer":"to win","wrong":["win","winning","won"],"ko":"과반수의 지지 없이도 투표에서 승리하는 것이 가능하다.","point":"가주어 it-진주어","id":17},{"lesson":"3","sent":"However, only 8 out of 20 council members chose the charity concert as their first preference, ___ equaled 40% of the total votes.","answer":"which","wrong":["that","what","it"],"ko":"하지만 20명의 자치회 구성원 중 8명만이 1지망으로 자선 콘서트를 골랐는데, 이는 전체 표의 40%에 해당했다.","point":"관계대명사 계속적 용법 which","id":18},{"lesson":"3","sent":"___ the charity concert only received 40% of the total votes, a second round of counting was required.","answer":"As","wrong":["Because of","Due to","Despite"],"ko":"자선 콘서트는 전체 표의 40%만을 받았기 때문에, 2차 집계가 필요했다.","point":"접속사 vs 전치사","id":19},{"lesson":"3","sent":"Option A, the art show, received the fewest first-preference votes, with only 5 council members ___ for it.","answer":"voting","wrong":["voted","vote","to vote"],"ko":"미술 전시회인 선택지 A는 오직 5명의 자치회 구성원들만 그것에 투표하며 가장 적은 1지망 표를 받았다.","point":"with+O+분사","id":20},{"lesson":"3","sent":"Therefore, option A was eliminated, and the 5 council members' votes ___ redistributed based on their second preferences.","answer":"were","wrong":["was","being","had"],"ko":"따라서 선택지 A는 제거되었고, 5명의 자치회 구성원들의 표가 그들의 두 번째 선호도에 따라 재분배되었다.","point":"수일치 심화","id":21},{"lesson":"3","sent":"It sometimes allows second-preference votes ___ a greater influence than first-preference votes.","answer":"to have","wrong":["have","having","had"],"ko":"그것은 때때로 2지망 표가 1지망 표보다 더 큰 영향력을 갖게 하기도 한다.","point":"5형식 목적격보어 to-v","id":22},{"lesson":"3","sent":"In this case, the bake sale won, but this was mainly ___ to the second-preference votes it received.","answer":"due","wrong":["because","since","although"],"ko":"이 경우에는 빵 바자회가 승리했지만, 이는 주로 그것이 얻은 2지망 표 때문이었다.","point":"접속사 vs 전치사","id":23},{"lesson":"3","sent":"In other words, 11 people preferred A to B, ___ either ABC, ACB, or CAB.","answer":"voting","wrong":["voted","votes","to be voted"],"ko":"즉, 11명이 ABC, ACB, CAB 중 하나에 투표하며 B보다 A를 선호했다.","point":"분사구문","id":24},{"lesson":"3","sent":"As option A, the art show, was preferred to both of the ___ options, it would be considered the winner.","answer":"other","wrong":["another","others","else"],"ko":"미술 전시회인 선택지 A가 나머지 두 선택지보다 더 선호되었으므로, 이 선택지가 승자로 간주될 것이었다.","point":"대명사 일치","id":25},{"lesson":"3","sent":"The Condorcet method's weakness is ___, along with being complex, it sometimes fails to select a winner.","answer":"that","wrong":["what","which","it"],"ko":"콩도르세 방식의 약점은 복잡하다는 것과 더불어 때때로 승자를 가려내지 못한다는 점이다.","point":"명사절 접속사/간접의문문","id":26},{"lesson":"3","sent":"This is especially true in elections ___ contain numerous options.","answer":"that","wrong":["where","what","in which"],"ko":"이는 많은 선택지를 포함하는 선거에서 특히 그렇다.","point":"관계부사 vs 관계대명사","id":27},{"lesson":"3","sent":"It is possible ___ no option will be clearly preferred over the others.","answer":"that","wrong":["what","whether","which"],"ko":"어떤 선택지도 다른 선택지들보다 명확하게 선호되지 않을 수 있다.","point":"가주어 it-진주어","id":28},{"lesson":"3","sent":"Instead of all methods pointing toward a single option and making the council's choice ___, the winner differed with each method.","answer":"easier","wrong":["more easily","easily","ease"],"ko":"모든 방식이 하나의 선택지를 가리키고 자치회의 선택을 더 쉽게 만드는 대신, 각 방식마다 승자는 달랐다.","point":"5형식 목적격보어 형용사","id":29},{"lesson":"3","sent":"After a long, intense discussion with Ms. Akers, the student council members decided to choose the Condorcet method, as they liked the idea of directly comparing each option with ___.","answer":"the others","wrong":["the other","another","other"],"ko":"Akers 선생님과의 오랜 열정적인 논의 끝에, 학생 자치회 구성원들은 콩도르세 방식을 선택하기로 결정했는데, 각 선택지를 다른 선택지들과 직접적으로 비교한다는 점이 마음에 들었기 때문이다.","point":"대명사 일치","id":30},{"lesson":"3","sent":"It is obvious that choosing an ideal voting method ___ a complex and challenging task.","answer":"is","wrong":["are","being","to be"],"ko":"이상적인 투표 방법을 선택하는 것은 복잡하고 도전적인 일이라는 것은 분명하다.","point":"수일치 심화","id":31},{"lesson":"3","sent":"No voting system is flawless or clearly superior ___ another.","answer":"to","wrong":["than","as","from"],"ko":"어떤 투표 시스템도 완벽하거나 다른 시스템보다 명백히 우수하지는 않다.","point":"비교구문","id":32},{"lesson":"3","sent":"___ we choose will have pros and cons.","answer":"Whichever","wrong":["Which","That","However"],"ko":"우리가 선택하는 어느 것이든 장단점이 있을 것이다.","point":"복합관계사","id":33},{"lesson":"3","sent":"Some people believe that it is best to keep the process ___ by not ranking our choices at all.","answer":"simple","wrong":["simply","simplicity","simplify"],"ko":"어떤 사람들은 우리들의 선택들에 아예 순위를 매기지 않음으로써 과정을 단순하게 유지하는 것이 최선이라고 생각한다.","point":"5형식 목적격보어 형용사","id":34},{"lesson":"3","sent":"Others continue to develop and test new ways of voting, ___ that more complex methods deliver more accurate results.","answer":"arguing","wrong":["argued","argues","are arguing"],"ko":"다른 사람들은 더 복잡한 방식이 더 정확한 결과를 가져온다고 주장하며 계속해서 새로운 투표 방법을 개발하고 시험한다.","point":"분사구문","id":35},{"lesson":"3","sent":"All of these efforts are designed not to make decision-making ___ and inefficient, but to help us make better decisions as a society.","answer":"difficult","wrong":["difficultly","difficulty","difficulties"],"ko":"이러한 모든 노력은 의사 결정을 어렵고 비효율적으로 만들기 위한 것이 아니라, 우리가 집단으로서 더 나은 의사 결정을 내릴 수 있게 돕기 위해 고안된 것이다.","point":"5형식 목적격보어 형용사","id":36},{"lesson":"3","sent":"All of these efforts are designed not to make decision-making difficult and inefficient, but ___ us make better decisions as a society.","answer":"to help","wrong":["helping","helped","helps"],"ko":"이러한 모든 노력은 의사 결정을 어렵고 비효율적으로 만들기 위한 것이 아니라, 우리가 집단으로서 더 나은 의사 결정을 내릴 수 있게 돕기 위해 고안된 것이다.","point":"병렬구조","id":37},{"lesson":"3","sent":"Ultimately, understanding all of the possible voting methods and weighing their pros and cons allows us ___ the process of decision-making.","answer":"to better understand","wrong":["better understand","better understanding","better understood"],"ko":"결국, 모든 가능한 투표 방법을 이해하고 장단점을 따져 보는 것은 우리가 의사 결정 과정을 더 잘 이해할 수 있게 한다.","point":"5형식 목적격보어 to-v","id":38},{"lesson":"3","sent":"Ultimately, understanding all of the possible voting methods and ___ their pros and cons allows us to better understand the process of decision-making.","answer":"weighing","wrong":["weigh","weighed","to weigh"],"ko":"결국, 모든 가능한 투표 방법을 이해하고 장단점을 따져 보는 것은 우리가 의사 결정 과정을 더 잘 이해할 수 있게 한다.","point":"병렬구조","id":39},{"lesson":"3","sent":"When we ___ decision-making better, we are more likely to become better decision-makers ourselves.","answer":"understand","wrong":["will understand","understood","understanding"],"ko":"우리가 의사 결정을 더 잘 이해할 때, 우리 스스로 더 나은 의사 결정자가 될 가능성이 더 높다.","point":"시제 심화","id":40}],"order":[{"lesson":"3","sentence":"Group decision-making is not as simple as our personal choices, as it involves numerous voices with differing opinions.","ko":"집단 의사 결정은 다른 의견을 가진 수많은 목소리를 수반하기 때문에 우리의 개인적인 선택들만큼 간단하지 않다.","point":"원급 비교 not as ~ as / 접속사 as(이유)","chunks":["Group decision-making","is","not as simple","as our","personal choices,","as it","involves","numerous voices","with differing","opinions."],"id":1},{"lesson":"3","sentence":"Voting is often used to make group decisions fairer and more efficient, and various voting methods have been developed over time.","ko":"투표는 흔히 집단 의사 결정을 더 공정하고 더 효율적으로 만들기 위해 사용되며, 시간이 흐르면서 다양한 투표 방법이 개발되어 왔다.","point":"be used to-v(목적) / make+O+형용사 / 현재완료 수동태","chunks":["Voting","is often used","to make","group decisions","fairer","and more efficient,","and","various voting methods","have been","developed","over time."],"id":2},{"lesson":"3","sentence":"The members of the Greenville High School student council needed to decide how to raise money for children in need.","ko":"Greenville 고등학교 학생 자치회의 구성원들은 어려움에 처한 아이들을 위해 모금할 방법을 결정해야 했다.","point":"의문사+to부정사","chunks":["The members","of the Greenville","High School","student council","needed","to decide","how","to raise","money","for children","in need."],"id":3},{"lesson":"3","sentence":"When they asked for advice from Ms. Akers, the council's advisor, she encouraged them not to use the familiar voting method, but to try something different instead.","ko":"그들이 자치회의 고문 교사인 Akers 선생님에게 조언을 구했을 때, 그녀는 익숙한 투표 방법을 사용하지 말고, 대신 다른 것을 시도해 보라고 권장했다.","point":"encourage+O+to부정사 / not A but B","chunks":["When they","asked for advice","from Ms. Akers,","the council's advisor,","she encouraged","them","not to use","the familiar","voting method,","but to try","something different","instead."],"id":4},{"lesson":"3","sentence":"Each of the 20 council members was given a voting slip and instructed to write down the options in order of preference.","ko":"20명의 자치회 구성원들 각각은 투표용지를 받았고, 선호하는 순서대로 선택지를 적으라는 지시를 받았다.","point":"each of+복수명사+단수동사 / 4형식·5형식 수동태","chunks":["Each of","the 20","council members","was given","a voting slip","and instructed","to write down","the options","in order","of preference."],"id":5},{"lesson":"3","sentence":"For example, if the charity concert was their first choice, followed by the bake sale and the art show, they would write CBA.","ko":"예를 들어, 자선 콘서트가 첫 번째 선택이고 빵 바자회와 미술 전시회가 뒤따른다면, 그들은 CBA를 적을 것이다.","point":"가정법 과거 / 분사구문(과거분사)","chunks":["For example,","if","the charity concert","was","their first choice,","followed by","the bake sale","and the art show,","they would","write CBA."],"id":6},{"lesson":"3","sentence":"However, only 8 out of 20 council members chose the charity concert as their first preference, which equaled 40% of the total votes.","ko":"하지만 20명의 자치회 구성원 중 8명만이 1지망으로 자선 콘서트를 골랐는데, 이는 전체 표의 40%에 해당했다.","point":"관계대명사 계속적 용법 which","chunks":["However,","only 8","out of 20","council members","chose","the charity concert","as their","first preference,","which equaled","40% of","the total votes."],"id":7},{"lesson":"3","sentence":"For an option to win in the first round, it needs to get more than 50% of the first-preference votes.","ko":"어떤 선택지가 1차 집계에서 승리하기 위해서는, 1지망 표의 50% 이상을 얻어야 한다.","point":"to부정사의 의미상 주어 for+목적격 / 부사적 용법(목적)","chunks":["For an option","to win","in the","first round,","it needs","to get","more than","50% of","the first-preference","votes."],"id":8},{"lesson":"3","sentence":"As option A, the art show, was preferred to both of the other options, it would be considered the winner.","ko":"미술 전시회인 선택지 A가 나머지 두 선택지보다 더 선호되었으므로, 이 선택지가 승자로 간주될 것이었다.","point":"수동태 / 조동사+수동태","chunks":["As","option A,","the art show,","was preferred","to both","of the other","options,","it would","be considered","the winner."],"id":9},{"lesson":"3","sentence":"Instead of all methods pointing toward a single option and making the council's choice easier, the winner differed with each method.","ko":"모든 방식이 하나의 선택지를 가리키고 자치회의 선택을 더 쉽게 만드는 대신, 각 방식마다 승자는 달랐다.","point":"전치사+동명사(의미상 주어) / make+O+형용사","chunks":["Instead of","all methods","pointing","toward","a single option","and making","the council's choice","easier,","the winner","differed","with each method."],"id":10},{"lesson":"3","sentence":"After a long, intense discussion with Ms. Akers, the student council members decided to choose the Condorcet method, as they liked the idea of directly comparing each option with the others.","ko":"Akers 선생님과의 오랜 열정적인 논의 끝에, 학생 자치회 구성원들은 콩도르세 방식을 선택하기로 결정했는데, 각 선택지를 다른 선택지들과 직접적으로 비교한다는 점이 마음에 들었기 때문이다.","point":"decide+to부정사 / 접속사 as(이유) / 동격의 of+동명사","chunks":["After a long,","intense discussion","with Ms. Akers,","the student council members","decided","to choose","the Condorcet method,","as they liked","the idea of","directly comparing","each option","with the others."],"id":11},{"lesson":"3","sentence":"It is obvious that choosing an ideal voting method is a complex and challenging task.","ko":"이상적인 투표 방법을 선택하는 것은 복잡하고 도전적인 일이라는 것은 분명하다.","point":"가주어 It ~ 진주어 that절 / 동명사 주어","chunks":["It is","obvious","that","choosing","an ideal","voting method","is","a complex","and challenging","task."],"id":12},{"lesson":"3","sentence":"Some people believe that it is best to keep the process simple by not ranking our choices at all.","ko":"어떤 사람들은 우리들의 선택들에 아예 순위를 매기지 않음으로써 과정을 단순하게 유지하는 것이 최선이라고 생각한다.","point":"가주어 it ~ to부정사 / by not -ing","chunks":["Some people","believe","that","it is best","to keep","the process","simple","by not","ranking","our choices","at all."],"id":13},{"lesson":"3","sentence":"All of these efforts are designed not to make decision-making difficult and inefficient, but to help us make better decisions as a society.","ko":"이러한 모든 노력은 의사 결정을 어렵고 비효율적으로 만들기 위한 것이 아니라, 우리가 집단으로서 더 나은 의사 결정을 내릴 수 있게 돕기 위해 고안된 것이다.","point":"not A but B / help+O+동사원형","chunks":["All of","these efforts","are designed","not to make","decision-making","difficult and inefficient,","but to help","us","make","better decisions","as a society."],"id":14},{"lesson":"3","sentence":"Ultimately, understanding all of the possible voting methods and weighing their pros and cons allows us to better understand the process of decision-making.","ko":"결국, 모든 가능한 투표 방법을 이해하고 장단점을 따져 보는 것은 우리가 의사 결정 과정을 더 잘 이해할 수 있게 ]]},{"word":"get advice on","type":"숙어","meaning":"~에 대해 조언을 얻다","lesson":"4","ans":"get advice on","fixed":["throw A in the trash","in a way that","it is common for A to-v"],"pool":["throw A in the trash","in a way that","it is common for A to-v","be focused on","would have p.p.","thanks to","contribute to","according to","prevent A from -ing","lawn mower"],"clash":[[2,8]]}],"vocab":[{"lesson":"4","sent":"On her way to a study group meeting, Liz ___ dropped her laptop on the street, seriously damaging it.","answer":"accidentally","wrong":["deliberately","intentionally","accurately"],"ko":"스터디 그룹 모임에 가는 길에, Liz는 실수로 그녀의 노트북을 길에 떨어뜨려 그것을 심각하게 손상시켰다.","id":1},{"lesson":"4","sent":"Although it still turns on, the screen is ___, and some keys are not working.","answer":"cracked","wrong":["creaked","tracked","stacked"],"ko":"그것은 여전히 켜지기는 하지만, 화면은 금이 갔고, 몇몇 키들은 작동하지 않는다.","id":2},{"lesson":"4","sent":"She can have it repaired, but she is ___ to do so.","answer":"hesitating","wrong":["hastening","hurrying","rushing"],"ko":"그녀는 그것을 수리할 수 있지만, 그렇게 하기를 망설이고 있다.","id":3},{"lesson":"4","sent":"In this case, getting rid of the old one and purchasing a new one might seem like a more ___ option.","answer":"reasonable","wrong":["seasonable","regrettable","ridiculous"],"ko":"이 경우에 오래된 노트북은 버리고 새로운 것을 구입하는 것이 더 합리적인 선택처럼 보일 수 있다.","id":4},{"lesson":"4","sent":"If Liz throws her laptop in the trash, she will be ___ to a serious problem: e-waste.","answer":"contributing","wrong":["attributing","distributing","conforming"],"ko":"만약 Liz가 그녀의 노트북을 쓰레기통에 버린다면, 그녀는 전자 쓰레기라는 심각한 문제에 기여하게 될 것이다.","id":5},{"lesson":"4","sent":"The term refers to ___ electronic devices and electrical appliances.","answer":"discarded","wrong":["discovered","disguised","discounted"],"ko":"이 용어는 버려진 전자 장치와 전기 기기를 나타낸다.","id":6},{"lesson":"4","sent":"Due to toxic materials contained in these products, such as lead, e-waste is a serious health and environmental ___.","answer":"hazard","wrong":["harvest","habitat","haven"],"ko":"이 제품들에 포함된 납과 같은 유독성 물질 때문에 전자 쓰레기는 심각한 건강 및 환경 위험 요소이다.","id":7},{"lesson":"4","sent":"Due to ___ materials contained in these products, such as lead, e-waste is a serious health and environmental hazard.","answer":"toxic","wrong":["harmless","nutritious","sterile"],"ko":"이 제품들에 포함된 납과 같은 유독성 물질 때문에 전자 쓰레기는 심각한 건강 및 환경 위험 요소이다.","id":8},{"lesson":"4","sent":"To make matters worse, the amount of e-waste produced each year is increasing at an ___ rate.","answer":"alarming","wrong":["charming","amusing","appealing"],"ko":"설상가상으로, 매년 생산되는 전자 쓰레기의 양은 걱정스러운 속도로 증가하고 있다.","id":9},{"lesson":"4","sent":"Experts ___ that by 2030, the amount of e-waste generated annually will have doubled in just 16 years.","answer":"predict","wrong":["protect","prevent","pretend"],"ko":"전문가들은 2030년에는 매년 발생하는 전자 쓰레기의 양이 단 16년 만에 두 배가 될 것으로 예측한다.","id":10},{"lesson":"4","sent":"Experts predict that by 2030, the amount of e-waste generated ___ will have doubled in just 16 years.","answer":"annually","wrong":["manually","mutually","anxiously"],"ko":"전문가들은 2030년에는 매년 발생하는 전자 쓰레기의 양이 단 16년 만에 두 배가 될 것으로 예측한다.","id":11},{"lesson":"4","sent":"For this reason, efforts are being made to ___ this problem, most of which are focused on making products easier to repair.","answer":"address","wrong":["adorn","addict","adopt"],"ko":"이러한 이유로 이 문제를 다루기 위해 노력이 이루어지고 있는데, 이 중 대부분은 제품들을 수리하기 더 쉽게 만드는 것에 중점을 두고 있다.","id":12},{"lesson":"4","sent":"Let's take a look at some ___ approaches from around the world.","answer":"practical","wrong":["impractical","theoretical","fictional"],"ko":"전 세계의 현실성 있는 접근법을 몇 가지 살펴보자.","id":13},{"lesson":"4","sent":"One reason many people ___ of their damaged devices is that they are too difficult to repair.","answer":"dispose","wrong":["approve","compose","dispense"],"ko":"많은 사람이 그들의 고장 난 장치들을 버리는 한 가지 이유는 그것들이 수리하기 너무 어렵기 때문이다.","id":14},{"lesson":"4","sent":"For example, a device may be difficult to ___, or its manufacturer may require that it be brought to an official service center to be fixed.","answer":"disassemble","wrong":["dissemble","resemble","dismiss"],"ko":"예를 들어, 어떤 장치는 분해하기 어려울 수 있고, 또는 그것의 제조사가 그것을 고치려면 공식 수리소로 가져올 것을 요구할 수도 있다.","id":15},{"lesson":"4","sent":"What is more, some products are ___ designed to be difficult to repair.","answer":"intentionally","wrong":["accidentally","additionally","intensively"],"ko":"게다가, 몇몇 제품은 의도적으로 수리하기 어렵게 만들어진다.","id":16},{"lesson":"4","sent":"It is common for consumers to be unable to ___ the instructions for how to fix their items or the parts needed to complete repairs.","answer":"acquire","wrong":["inquire","require","acquit"],"ko":"소비자들이 그들의 물건을 고치는 방법에 대한 설명이나 수리를 완료하기 위해 필요한 부품들을 얻지 못하는 것은 흔하다.","id":17},{"lesson":"4","sent":"The right-to-repair movement is trying to solve these problems by ___ legislation that states the following: If you own a product, you have the right to fix it yourself or bring it to a technician of your choice.","answer":"promoting","wrong":["prompting","protecting","provoking"],"ko":"수리할 권리 운동은 다음 내용을 명시하는 법률 제정을 추진함으로써 이러한 문제들을 해결하려고 하고 있는데, 그것은 만약 당신이 어떤 제품을 소유하고 있다면, 당신은 그것을 직접 고치거나 당신이 선택한 기술자에게 가지고 갈 권리가 있다는 내용이다.","id":18},{"lesson":"4","sent":"Second, third parties, including individuals, should be able to ___ the parts and tools required to make repairs.","answer":"obtain","wrong":["contain","retain","obstruct"],"ko":"두 번째로, 개인을 포함한 제삼자가 수리를 하기 위해 필요한 부품들과 도구들을 구할 수 있어야 한다.","id":19},{"lesson":"4","sent":"Third, the practice of preventing consumers from installing custom software on their own devices should be ___ by law.","answer":"prohibited","wrong":["permitted","exhibited","promoted"],"ko":"세 번째로, 소비자들이 맞춤형 소프트웨어를 자신의 장치에 설치하지 못하게 하는 행위는 법으로 금지되어야 한다.","id":20},{"lesson":"4","sent":"Advocates of the movement say that if all these goals are ___, far less e-waste will be generated.","answer":"accomplished","wrong":["accompanied","acknowledged","accumulated"],"ko":"이 운동의 지지자들은 만약 이 모든 목표가 이루어진다면, 훨씬 적은 전자 쓰레기가 발생할 것이라고 말한다.","id":21},{"lesson":"4","sent":"Thanks to their efforts, more than 40 states in the U.S. have begun working on right-to-repair ___.","answer":"legislation","wrong":["litigation","limitation","liberation"],"ko":"그들의 노력 덕분에 미국 40개 이상의 주에서 수리할 권리 법률 제정을 위해 노력하기 시작했다.","id":22},{"lesson":"4","sent":"This movement is gaining a growing ___ in Europe as well, with more and more countries joining the cause.","answer":"influence","wrong":["affluence","influenza","inference"],"ko":"이 운동은 점점 더 많은 국가들이 그 대의에 동참하면서 유럽에서도 영향력이 커지고 있다.","id":23},{"lesson":"4","sent":"In January 2021, the French government passed a ___ that requires that every manufacturer include a \"repairability index\" on five categories of electronic devices and electrical appliances: smartphones, laptops, washing machines, televisions, and lawn mowers.","answer":"bill","wrong":["ball","pill","bell"],"ko":"2021년 1월, 프랑스 정부는 모든 제조사가 스마트폰, 노트북, 세탁기, 텔레비전, 그리고 잔디 깎는 기계라는 다섯 가지 종류의 전자 장치와 전자 기기에 '수리 가능성 지수'를 포함시킬 것을 요구하는 법안을 통과시켰다.","id":24},{"lesson":"4","sent":"The index takes into ___ several elements, including the availability of repair information, the ease of disassembly, and the price of spare parts.","answer":"account","wrong":["amount","accord","count"],"ko":"그 지수는 수리 정보의 이용 가능성, 분해의 용이성, 그리고 여분 부품의 가격을 포함하여 몇 가지 요소를 고려한다.","id":25},{"lesson":"4","sent":"A low number on a bright red label means that repairing the product will be difficult, whereas a high number on a green label ___ that the product is easy to repair.","answer":"indicates","wrong":["dedicates","indicts","implicates"],"ko":"초록색 라벨의 높은 숫자는 그 제품이 수리하기 쉽다는 것을 나타내는 데에 반하여, 밝은 빨간색 라벨의 낮은 숫자는 그 제품을 수리하는 것이 어려울 것이라는 것을 의미한다.","id":26},{"lesson":"4","sent":"Firstly, it allows consumers to make ___ decisions when purchasing new devices and appliances.","answer":"informed","wrong":["uninformed","reformed","conformed"],"ko":"첫 번째로, 그것은 소비자들이 새로운 장치와 기기를 구입할 때 정보에 근거한 결정을 내릴 수 있도록 한다.","id":27},{"lesson":"4","sent":"Secondly, it ___ manufacturers to make their products easier to repair.","answer":"encourages","wrong":["discourages","forbids","deters"],"ko":"두 번째로, 그것은 제조사들이 자신의 제품을 수리하기 더 쉽게 만들도록 장려한다.","id":28},{"lesson":"4","sent":"As a result, with fewer electronic and electrical items ending up in its landfills, France can expect to make a ___ to a more sustainable society in the near future.","answer":"transition","wrong":["translation","transmission","tradition"],"ko":"결과적으로, 더 적은 전자 및 전기 제품들이 쓰레기 매립지에 이르게 되면서, 프랑스는 가까운 미래에 더 지속 가능한 사회로 변화할 것을 기대할 수 있다.","id":29},{"lesson":"4","sent":"As a result, with fewer electronic and electrical items ending up in its ___, France can expect to make a transition to a more sustainable society in the near future.","answer":"landfills","wrong":["landmarks","landslides","landlords"],"ko":"결과적으로, 더 적은 전자 및 전기 제품들이 쓰레기 매립지에 이르게 되면서, 프랑스는 가까운 미래에 더 지속 가능한 사회로 변화할 것을 기대할 수 있다.","id":30},{"lesson":"4","sent":"If the index is successful, we can ___ seeing more countries around the world following France's innovative lead.","answer":"anticipate","wrong":["participate","emancipate","dissipate"],"ko":"만약 이 지수가 성공적이라면, 우리는 전 세계의 더 많은 나라들이 프랑스의 혁신적인 선례를 따르는 것을 보길 기대할 수 있다.","id":31},{"lesson":"4","sent":"If the index is successful, we can anticipate seeing more countries around the world following France's ___ lead.","answer":"innovative","wrong":["invasive","imitative","indicative"],"ko":"만약 이 지수가 성공적이라면, 우리는 전 세계의 더 많은 나라들이 프랑스의 혁신적인 선례를 따르는 것을 보길 기대할 수 있다.","id":32},{"lesson":"4","sent":"The cafés are ___ by volunteer experts who can give technical advice and teach people how to fix things.","answer":"staffed","wrong":["stuffed","stalled","starved"],"ko":"그 카페들은 기술적인 조언을 줄 수 있고, 사람들에게 물건을 고치는 방법을 가르쳐 줄 수 있는 자원봉사자 전문가들을 직원으로 두고 있다.","id":33},{"lesson":"4","sent":"Along with preventing damaged items from becoming e-waste, these cafés also encourage people to share their ___ skills and knowledge about the repair and maintenance of electronics.","answer":"invaluable","wrong":["valueless","invalid","invariable"],"ko":"고장 난 물건들이 전자 쓰레기가 되는 것을 막는 것과 더불어, 이 카페들은 또한 사람들이 전자 제품의 수리와 보수 관리에 대한 매우 유용한 기술들과 지식을 공유할 수 있도록 장려한다.","id":34},{"lesson":"4","sent":"Along with preventing damaged items from becoming e-waste, these cafés also encourage people to share their invaluable skills and knowledge about the repair and ___ of electronics.","answer":"maintenance","wrong":["sustenance","appearance","attendance"],"ko":"고장 난 물건들이 전자 쓰레기가 되는 것을 막는 것과 더불어, 이 카페들은 또한 사람들이 전자 제품의 수리와 보수 관리에 대한 매우 유용한 기술들과 지식을 공유할 수 있도록 장려한다.","id":35},{"lesson":"4","sent":"They continue to grow in ___, with more and more people signing up to volunteer.","answer":"popularity","wrong":["population","poverty","punctuality"],"ko":"점점 더 많은 사람들이 자원봉사를 하기 위해 신청하면서, 이 카페들은 계속해서 인기를 얻고 있다.","id":36},{"lesson":"4","sent":"By providing spaces where people can learn, Repair Cafés enable individuals to maintain their devices and ___ their life spans.","answer":"extend","wrong":["expend","shorten","extract"],"ko":"사람들이 배울 수 있는 공간을 제공함으로써, 수리 카페들은 개인이 자신들의 장치를 유지하고 그것들의 수명을 연장할 수 있게 한다.","id":37},{"lesson":"4","sent":"Furthermore, they ___ a sustainable perspective that can have a huge positive impact on our future.","answer":"foster","wrong":["fester","falter","forfeit"],"ko":"게다가 그것들은 우리의 미래에 막대한 긍정적인 영향을 미칠 수 있는 지속 가능한 관점을 조성한다.","id":38},{"lesson":"4","sent":"Furthermore, they foster a sustainable ___ that can have a huge positive impact on our future.","answer":"perspective","wrong":["prospectus","respect","inspector"],"ko":"게다가 그것들은 우리의 미래에 막대한 긍정적인 영향을 미칠 수 있는 지속 가능한 관점을 조성한다.","id":39},{"lesson":"4","sent":"She would be able to order the necessary parts online and ___ them herself.","answer":"replace","wrong":["replay","repeal","retail"],"ko":"그녀는 인터넷에서 필요한 부품들을 주문하고, 그것들을 직접 교체할 수 있었을 것이다.","id":40}],"gram":[{"lesson":"4","sent":"___ it still turns on, the screen is cracked, and some keys are not working.","answer":"Although","wrong":["Despite","However","In spite of"],"ko":"그것은 여전히 켜지기는 하지만, 화면은 금이 갔고, 몇몇 키들은 작동하지 않는다.","point":"접속사 vs 전치사","id":1},{"lesson":"4","sent":"She can have it ___, but she is hesitating to do so.","answer":"repaired","wrong":["repair","to repair","repairing"],"ko":"그녀는 그것을 수리할 수 있지만, 그렇게 하기를 망설이고 있다.","point":"사역동사 have + O + p.p.","id":2},{"lesson":"4","sent":"In this case, getting rid of the old one and ___ a new one might seem like a more reasonable option.","answer":"purchasing","wrong":["purchase","to purchase","purchased"],"ko":"이 경우에 오래된 노트북은 버리고 새로운 것을 구입하는 것이 더 합리적인 선택처럼 보일 수 있다.","point":"병렬구조","id":3},{"lesson":"4","sent":"The term refers to ___ electronic devices and electrical appliances.","answer":"discarded","wrong":["discarding","discard","discards"],"ko":"이 용어는 버려진 전자 장치와 전기 기기를 나타낸다.","point":"분사의 능동/수동 (명사 수식)","id":4},{"lesson":"4","sent":"Due to toxic materials ___ in these products, such as lead, e-waste is a serious health and environmental hazard.","answer":"contained","wrong":["containing","contain","to contain"],"ko":"이 제품들에 포함된 납과 같은 유독성 물질 때문에 전자 쓰레기는 심각한 건강 및 환경 위험 요소이다.","point":"분사의 능동/수동 (명사 수식)","id":5},{"lesson":"4","sent":"To make matters worse, the amount of e-waste produced each year is increasing at an ___ rate.","answer":"alarming","wrong":["alarmed","alarm","to alarm"],"ko":"설상가상으로, 매년 생산되는 전자 쓰레기의 양은 걱정스러운 속도로 증가하고 있다.","point":"감정동사 분사","id":6},{"lesson":"4","sent":"Experts predict that by 2030, the amount of e-waste generated annually ___ doubled in just 16 years.","answer":"will have","wrong":["had","has","have"],"ko":"전문가들은 2030년에는 매년 발생하는 전자 쓰레기의 양이 단 16년 만에 두 배가 될 것으로 예측한다.","point":"미래완료 시제","id":7},{"lesson":"4","sent":"For this reason, efforts are ___ made to address this problem, most of which are focused on making products easier to repair.","answer":"being","wrong":["been","be","having"],"ko":"이러한 이유로 이 문제를 다루기 위해 노력이 이루어지고 있는데, 이 중 대부분은 제품들을 수리하기 더 쉽게 만드는 것에 중점을 두고 있다.","point":"진행형 수동태","id":8},{"lesson":"4","sent":"For this reason, efforts are being made to address this problem, most of ___ are focused on making products easier to repair.","answer":"which","wrong":["them","whom","that"],"ko":"이러한 이유로 이 문제를 다루기 위해 노력이 이루어지고 있는데, 이 중 대부분은 제품들을 수리하기 더 쉽게 만드는 것에 중점을 두고 있다.","point":"부분표현 + 관계대명사","id":9},{"lesson":"4","sent":"For this reason, efforts are being made to address this problem, most of which are focused on making products ___ to repair.","answer":"easier","wrong":["more easily","easily","ease"],"ko":"이러한 이유로 이 문제를 다루기 위해 노력이 이루어지고 있는데, 이 중 대부분은 제품들을 수리하기 더 쉽게 만드는 것에 중점을 두고 있다.","point":"5형식 목적격보어 형용사","id":10},{"lesson":"4","sent":"One reason many people dispose of their damaged devices is ___ they are too difficult to repair.","answer":"that","wrong":["what","which","it"],"ko":"많은 사람이 그들의 고장 난 장치들을 버리는 한 가지 이유는 그것들이 수리하기 너무 어렵기 때문이다.","point":"명사절 접속사 that vs what","id":11},{"lesson":"4","sent":"For example, a device may be difficult to disassemble, or its manufacturer may require that it ___ brought to an official service center to be fixed.","answer":"be","wrong":["being","been","to be"],"ko":"예를 들어, 어떤 장치는 분해하기 어려울 수 있고, 또는 그것의 제조사가 그것을 고치려면 공식 수리소로 가져올 것을 요구할 수도 있다.","point":"요구 동사 + that + (should) 동사원형","id":12},{"lesson":"4","sent":"Many companies do not allow their customers ___ their damaged items to third-party repair shops.","answer":"to take","wrong":["take","taking","taken"],"ko":"많은 회사는 그들의 고객들이 고장 난 물건들을 제삼자의 수리점으로 가지고 가는 것을 허용하지 않는다.","point":"5형식 목적격보어 to-v","id":13},{"lesson":"4","sent":"___ is common for consumers to be unable to acquire the instructions for how to fix their items or the parts needed to complete repairs.","answer":"It","wrong":["That","This","What"],"ko":"소비자들이 그들의 물건을 고치는 방법에 대한 설명이나 수리를 완료하기 위해 필요한 부품들을 얻지 못하는 것은 흔하다.","point":"가주어 it - 진주어 to-v","id":14},{"lesson":"4","sent":"If you own a product, you have the right to fix it yourself or ___ it to a technician of your choice.","answer":"bring","wrong":["bringing","brought","brings"],"ko":"만약 당신이 어떤 제품을 소유하고 있다면, 당신은 그것을 직접 고치거나 당신이 선택한 기술자에게 가지고 갈 권리가 있다.","point":"병렬구조","id":15},{"lesson":"4","sent":"First, companies must make information about their products ___ to everyone.","answer":"available","wrong":["availably","availability","to be available"],"ko":"첫 번째로, 회사들은 그들의 제품에 대한 정보를 모두가 이용할 수 있게 해야 한다.","point":"5형식 목적격보어 형용사","id":16},{"lesson":"4","sent":"Second, third parties, including individuals, should be able to obtain the parts and tools ___ to make repairs.","answer":"required","wrong":["requiring","require","requires"],"ko":"두 번째로, 개인을 포함한 제삼자가 수리를 하기 위해 필요한 부품들과 도구들을 구할 수 있어야 한다.","point":"분사의 능동/수동 (명사 수식)","id":17},{"lesson":"4","sent":"Finally, it demands that manufacturers ___ devices in a way that makes repairs as easy as possible.","answer":"design","wrong":["designs","designed","to design"],"ko":"마지막으로, 그것은 제조사들에게 수리를 최대한 쉽게 만드는 방식으로 장치를 설계할 것을 요구한다.","point":"요구 동사 + that + (should) 동사원형","id":18},{"lesson":"4","sent":"Finally, it demands that manufacturers design devices in a way ___ makes repairs as easy as possible.","answer":"that","wrong":["what","how","where"],"ko":"마지막으로, 그것은 제조사들에게 수리를 최대한 쉽게 만드는 방식으로 장치를 설계할 것을 요구한다.","point":"관계대명사 that vs what/관계부사","id":19},{"lesson":"4","sent":"Advocates of the movement say that if all these goals ___, far less e-waste will be generated.","answer":"are accomplished","wrong":["will be accomplished","will accomplish","accomplish"],"ko":"이 운동의 지지자들은 만약 이 모든 목표가 이루어진다면, 훨씬 적은 전자 쓰레기가 발생할 것이라고 말한다.","point":"조건 부사절의 현재시제","id":20},{"lesson":"4","sent":"Advocates of the movement say that if all these goals are accomplished, ___ less e-waste will be generated.","answer":"far","wrong":["very","more","such"],"ko":"이 운동의 지지자들은 만약 이 모든 목표가 이루어진다면, 훨씬 적은 전자 쓰레기가 발생할 것이라고 말한다.","point":"비교급 강조","id":21},{"lesson":"4","sent":"This movement is gaining a growing influence in Europe as well, with more and more countries ___ the cause.","answer":"joining","wrong":["joined","join","to join"],"ko":"이 운동은 점점 더 많은 국가들이 그 대의에 동참하면서 유럽에서도 영향력이 커지고 있다.","point":"with + O + 분사","id":22},{"lesson":"4","sent":"___ a score ranging from 0 to 10, as well as a color-coded system, the index lets consumers see how easily the product can be repaired before they purchase it.","answer":"Using","wrong":["Used","Use","Uses"],"ko":"그 지수는 색상으로 표시되는 시스템뿐만 아니라 0에서 10 사이의 점수도 사용하여 소비자들이 제품을 구입하기 전에 그것이 얼마나 쉽게 수리될 수 있는지 알 수 있게 해 준다.","point":"분사구문","id":23},{"lesson":"4","sent":"Using a score ranging from 0 to 10, as well as a color-coded system, the index lets consumers ___ how easily the product can be repaired before they purchase it.","answer":"see","wrong":["to see","seeing","seen"],"ko":"그 지수는 색상으로 표시되는 시스템뿐만 아니라 0에서 10 사이의 점수도 사용하여 소비자들이 제품을 구입하기 전에 그것이 얼마나 쉽게 수리될 수 있는지 알 수 있게 해 준다.","point":"사역동사 let + O + 동사원형","id":24},{"lesson":"4","sent":"Using a score ranging from 0 to 10, as well as a color-coded system, the index lets consumers see how easily ___ repaired before they purchase it.","answer":"the product can be","wrong":["can the product be","can be the product","the product can"],"ko":"그 지수는 색상으로 표시되는 시스템뿐만 아니라 0에서 10 사이의 점수도 사용하여 소비자들이 제품을 구입하기 전에 그것이 얼마나 쉽게 수리될 수 있는지 알 수 있게 해 준다.","point":"간접의문문 어순","id":25},{"lesson":"4","sent":"A low number on a bright red label ___ that repairing the product will be difficult, whereas a high number on a green label indicates that the product is easy to repair.","answer":"means","wrong":["mean","meaning","to mean"],"ko":"초록색 라벨의 높은 숫자는 그 제품이 수리하기 쉽다는 것을 나타내는 데에 반하여, 밝은 빨간색 라벨의 낮은 숫자는 그 제품을 수리하는 것이 어려울 것이라는 것을 의미한다.","point":"수일치 (주어와 동사가 먼 경우)","id":26},{"lesson":"4","sent":"A low number on a bright red label means that repairing the product will be difficult, ___ a high number on a green label indicates that the product is easy to repair.","answer":"whereas","wrong":["unlike","despite","instead of"],"ko":"초록색 라벨의 높은 숫자는 그 제품이 수리하기 쉽다는 것을 나타내는 데에 반하여, 밝은 빨간색 라벨의 낮은 숫자는 그 제품을 수리하는 것이 어려울 것이라는 것을 의미한다.","point":"접속사 vs 전치사","id":27},{"lesson":"4","sent":"Firstly, it allows consumers to make informed decisions when ___ new devices and appliances.","answer":"purchasing","wrong":["purchased","purchase","to purchase"],"ko":"첫 번째로, 그것은 소비자들이 새로운 장치와 기기를 구입할 때 정보에 근거한 결정을 내릴 수 있도록 한다.","point":"분사구문","id":28},{"lesson":"4","sent":"As a result, with fewer electronic and electrical items ___ up in its landfills, France can expect to make a transition to a more sustainable society in the near future.","answer":"ending","wrong":["ended","end","to end"],"ko":"결과적으로, 더 적은 전자 및 전기 제품들이 쓰레기 매립지에 이르게 되면서, 프랑스는 가까운 미래에 더 지속 가능한 사회로 변화할 것을 기대할 수 있다.","point":"with + O + 분사","id":29},{"lesson":"4","sent":"The impact of the index, however, ___ likely to spread far beyond France.","answer":"is","wrong":["are","being","be"],"ko":"하지만 그 지수의 영향은 프랑스를 넘어 더 멀리 퍼질 가능성이 있다.","point":"수일치 (주어와 동사가 먼 경우)","id":30},{"lesson":"4","sent":"If the index is successful, we can anticipate seeing more countries around the world ___ France's innovative lead.","answer":"following","wrong":["followed","to follow","follows"],"ko":"만약 이 지수가 성공적이라면, 우리는 전 세계의 더 많은 나라들이 프랑스의 혁신적인 선례를 따르는 것을 보길 기대할 수 있다.","point":"지각동사 see + O + -ing","id":31},{"lesson":"4","sent":"When consumers ___ the right tools and materials, along with some helpful advice, they can repair much of the damage that occurs to electronic products by themselves.","answer":"are given","wrong":["is given","given","being given"],"ko":"소비자들에게 유용한 조언과 함께 알맞은 도구와 재료가 주어지면, 그들은 전자 제품에 발생하는 대부분의 손상을 직접 수리할 수 있다.","point":"4형식 수동태","id":32},{"lesson":"4","sent":"That is ___ Repair Cafés were started.","answer":"why","wrong":["what","which","who"],"ko":"그것이 수리 카페가 시작된 이유이다.","point":"관계부사 why/where","id":33},{"lesson":"4","sent":"They are free meeting places ___ people can gather together and fix their broken devices.","answer":"where","wrong":["which","what","when"],"ko":"그곳은 사람들이 함께 모여 자신들의 고장 난 장치들을 고칠 수 있는 자유로운 만남의 장소이다.","point":"관계부사 why/where","id":34},{"lesson":"4","sent":"It was ___ a success that the idea soon spread to neighboring countries.","answer":"such","wrong":["so","too","very"],"ko":"그것은 너무 성공적이어서 그 아이디어가 곧 이웃 나라들로 확산되었다.","point":"so/such ~ that","id":35},{"lesson":"4","sent":"By providing spaces where people can learn, Repair Cafés enable individuals ___ their devices and extend their life spans.","answer":"to maintain","wrong":["maintain","maintaining","maintained"],"ko":"사람들이 배울 수 있는 공간을 제공함으로써, 수리 카페들은 개인이 자신들의 장치를 유지하고 그것들의 수명을 연장할 수 있게 한다.","point":"5형식 목적격보어 to-v","id":36},{"lesson":"4","sent":"Imagine she lived in a world where repairing damaged devices and appliances ___ simply part of everyday life.","answer":"was","wrong":["were","being","been"],"ko":"그녀가 손상된 장치와 기기를 수리하는 것이 그저 일상의 한 부분인 세상에 살고 있었다고 상상해 보라.","point":"수일치 (동명사구 주어)","id":37},{"lesson":"4","sent":"If that were the case, her options ___ be limited to paying for expensive repairs or throwing away her laptop and buying a new one.","answer":"wouldn't","wrong":["won't","didn't","hadn't"],"ko":"만약 그랬다면, 그녀의 선택지는 비싼 수리를 위해 비용을 지불하거나 노트북을 버리고 새것을 사는 것으로 제한되지는 않았을 것이다.","point":"가정법 과거","id":38},{"lesson":"4","sent":"Repairing it probably wouldn't be very hard, and she likely ___ have purchased a laptop with a high repairability score.","answer":"would","wrong":["should","cannot","need not"],"ko":"그녀는 높은 수리 가능성 점수를 가진 노트북을 구매했을 것이기 때문에, 그것을 수리하는 것은 아마 아주 어렵지는 않았을 것이다.","point":"조동사 + have p.p.","id":39},{"lesson":"4","sent":"Even more importantly, it is a future in ___ people will generate far less e-waste, making our planet a cleaner, healthier place for everyone.","answer":"which","wrong":["that","what","where"],"ko":"훨씬 더 중요한 것은 그것은 사람들이 훨씬 적은 전자 쓰레기를 발생시킬 미래이며, 이는 우리의 지구를 모두를 위한 더 깨끗하고 건강한 곳으로 만들 것이라는 것이다.","point":"전치사 + 관계대명사","id":40}],"order":[{"lesson":"4","sentence":"On her way to a study group meeting, Liz accidentally dropped her laptop on the street, seriously damaging it.","ko":"스터디 그룹 모임에 가는 길에, Liz는 실수로 그녀의 노트북을 길에 떨어뜨려 그것을 심각하게 손상시켰다.","point":"분사구문(연속 동작·결과)","chunks":["On her way","to a study group meeting,","Liz","accidentally","dropped","her laptop","on the street,","seriously","damaging","it."],"id":1},{"lesson":"4","sentence":"In this case, getting rid of the old one and purchasing a new one might seem like a more reasonable option.","ko":"이 경우에 오래된 노트북은 버리고 새로운 것을 구입하는 것이 더 합리적인 선택처럼 보일 수 있다.","point":"동명사 주어 병렬 / seem like+명사","chunks":["In this case,","getting rid of","the old one","and purchasing","a new one","might seem","like","a more","reasonable","option."],"id":2},{"lesson":"4","sentence":"Experts predict that by 2030, the amount of e-waste generated annually will have doubled in just 16 years.","ko":"전문가들은 2030년에는 매년 발생하는 전자 쓰레기의 양이 단 16년 만에 두 배가 될 것으로 예측한다.","point":"미래완료 / 과거분사 후치 수식","chunks":["Experts predict","that","by 2030,","the amount","of e-waste","generated","annually","will have doubled","in just","16 years."],"id":3},{"lesson":"4","sentence":"For this reason, efforts are being made to address this problem, most of which are focused on making products easier to repair.","ko":"이러한 이유로 이 문제를 다루기 위해 노력이 이루어지고 있는데, 이 중 대부분은 제품들을 수리하기 더 쉽게 만드는 것에 중점을 두고 있다.","point":"진행형 수동태 / 부분표현+관계대명사","chunks":["For this reason,","efforts","are being made","to address","this problem,","most of which","are focused","on making","products","easier","to repair."],"id":4},{"lesson":"4","sentence":"It is common for consumers to be unable to acquire the instructions for how to fix their items or the parts needed to complete repairs.","ko":"소비자들이 그들의 물건을 고치는 방법에 대한 설명이나 수리를 완료하기 위해 필요한 부품들을 얻지 못하는 것은 흔하다.","point":"가주어 it+의미상 주어+to부정사 / 과거분사 후치 수식","chunks":["It is common","for consumers","to be unable","to acquire","the instructions","for how","to fix","their items","or the parts","needed","to complete","repairs."],"id":5},{"lesson":"4","sentence":"Third, the practice of preventing consumers from installing custom software on their own devices should be prohibited by law.","ko":"세 번째로, 소비자들이 맞춤형 소프트웨어를 자신의 장치에 설치하지 못하게 하는 행위는 법으로 금지되어야 한다.","point":"prevent O from -ing / 조동사 수동태","chunks":["Third,","the practice","of preventing","consumers","from installing","custom software","on their","own devices","should be","prohibited","by law."],"id":6},{"lesson":"4","sentence":"Finally, it demands that manufacturers design devices in a way that makes repairs as easy as possible.","ko":"마지막으로, 그것은 제조사들에게 수리를 최대한 쉽게 만드는 방식으로 장치를 설계할 것을 요구한다.","point":"요구 동사+that+(should) 동사원형 / as ~ as possible","chunks":["Finally,","it demands","that","manufacturers","design devices","in a way","that makes","repairs","as easy","as possible."],"id":7},{"lesson":"4","sentence":"Using a score ranging from 0 to 10, as well as a color-coded system, the index lets consumers see how easily the product can be repaired before they purchase it.","ko":"그 지수는 색상으로 표시되는 시스템뿐만 아니라 0에서 10 사이의 점수도 사용하여 소비자들이 제품을 구입하기 전에 그것이 얼마나 쉽게 수리될 수 있는지 알 수 있게 해 준다.","point":"분사구문 / let+O+동사원형 / 간접의문문","chunks":["Using a score","ranging from","0 to 10,","as well as","a color-coded system,","the index","lets consumers","see","how easily","the product","can be repaired","before they","purchase it."],"id":8},{"lesson":"4","sentence":"A low number on a bright red label means that repairing the product will be difficult, whereas a high number on a green label indicates that the product is easy to repair.","ko":"초록색 라벨의 높은 숫자는 그 제품이 수리하기 쉽다는 것을 나타내는 데에 반하여, 밝은 빨간색 라벨의 낮은 숫자는 그 제품을 수리하는 것이 어려울 것이라는 것을 의미한다.","point":"명사절 that / 동명사 주어 / 대조 접속사 whereas","chunks":["A low number","on a bright red label","means that","repairing the product","will be difficult,","whereas","a high number","on a green label","indicates that","the product","is easy","to repair."],"id":9},{"lesson":"4","sentence":"As a result, with fewer electronic and electrical items ending up in its landfills, France can expect to make a transition to a more sustainable society in the near future.","ko":"결과적으로, 더 적은 전자 및 전기 제품들이 쓰레기 매립지에 이르게 되면서, 프랑스는 가까운 미래에 더 지속 가능한 사회로 변화할 것을 기대할 수 있다.","point":"with+O+현재분사 / expect+to부정사","chunks":["As a result,","with fewer","electronic and electrical items","ending up","in its landfills,","France","can expect","to make","a transition","to a more sustainable society","in the near future."],"id":10},{"lesson":"4","sentence":"We live in a global economy, and any company that wants to sell its appliances on the French market will need to label its products according to the repairability index.","ko":"우리는 세계 경제 속에 살고 있으며, 프랑스 시장에서 기기를 판매하고 싶은 모든 회사는 그들의 제품에 수리 가능성 지수에 따라 라벨을 붙여야 할 것이다.","point":"주격 관계대명사절 / 수일치","chunks":["We live","in a global economy,","and any company","that wants","to sell","its appliances","on the French market","will need","to label","its products","according to","the repairability index."],"id":11},{"lesson":"4","sentence":"Along with preventing damaged items from becoming e-waste, these cafés also encourage people to share their invaluable skills and knowledge about the repair and maintenance of electronics.","ko":"고장 난 물건들이 전자 쓰레기가 되는 것을 막는 것과 더불어, 이 카페들은 또한 사람들이 전자 제품의 수리와 보수 관리에 대한 매우 유용한 기술들과 지식을 공유할 수 있도록 장려한다.","point":"prevent A from -ing / encourage+O+to부정사","chunks":["Along with","preventing","damaged items","from becoming","e-waste,","these cafés","also encourage","people","to share","their invaluable skills and knowledge","about the repair","and maintenance","of electronics."],"id":12},{"lesson":"4","sentence":"By providing spaces where people can learn, Repair Cafés enable individuals to maintain their devices and extend their life spans.","ko":"사람들이 배울 수 있는 공간을 제공함으로써, 수리 카페들은 개인이 자신들의 장치를 유지하고 그것들의 수명을 연장할 수 있게 한다.","point":"by+동명사 / 관계부사 where / enable+O+to부정사 병렬","chunks":["By providing","spaces","where","people","can learn,","Repair Cafés","enable","individuals","to maintain","their devices","and extend","their life spans."],"id":13},{"lesson":"4","sentence":"If that were the case, her options wouldn't be limited to paying for expensive repairs or throwing away her laptop and buying a new one.","ko":"만약 그랬
