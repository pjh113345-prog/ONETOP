<style>
/* Layout: one-screen phone game. Start = name + five test cards; game = HUD, timer, question card, choices (or chunk tray for 순서배열). Navy ink with a stamp-red accent, the 원탑 house look. */
:root{
  --bg:#f3f4f8; --surface:#ffffff; --surface-2:#e8eaf2; --ink:#1b2140; --muted:#5d6482;
  --line:#d3d7e5; --accent:#2f4ad0; --accent-ink:#ffffff; --stamp:#d8382c;
  --good:#1c9a57; --good-bg:#e1f5ea; --bad:#d8382c; --bad-bg:#fbe5e2; --warn:#ef7d16;
  --gold:#d79b00; --shadow:0 1px 2px rgba(27,33,64,.08),0 4px 14px rgba(27,33,64,.06); --on-color:#ffffff;
  --f-display:"Black Han Sans","Noto Sans KR",system-ui,sans-serif;
  --f-body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-en:"Source Serif 4",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10132a; --surface:#1a1e3b; --surface-2:#252a4d; --ink:#eef0fb; --muted:#a3a9c9;
  --line:#343a63; --accent:#7d90ff; --accent-ink:#0c0f24; --stamp:#ff6b5e;
  --good:#3fd387; --good-bg:#173b2c; --bad:#ff6b5e; --bad-bg:#47201f; --warn:#ffa043;
  --gold:#ffcc4d; --shadow:0 1px 2px rgba(0,0,0,.4); --on-color:#0c0f24; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10132a; --surface:#1a1e3b; --surface-2:#252a4d; --ink:#eef0fb; --muted:#a3a9c9;
  --line:#343a63; --accent:#7d90ff; --accent-ink:#0c0f24; --stamp:#ff6b5e;
  --good:#3fd387; --good-bg:#173b2c; --bad:#ff6b5e; --bad-bg:#47201f; --warn:#ffa043;
  --gold:#ffcc4d; --shadow:0 1px 2px rgba(0,0,0,.4); --on-color:#0c0f24; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;word-break:keep-all;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
.wrap{max-width:580px;margin:0 auto;padding-block:8px 150px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--f-display);font-weight:400;letter-spacing:.01em;margin:0;text-wrap:balance}
h2{font-size:20px}

.brand{display:flex;align-items:center;gap:10px;margin:6px 0 14px}
.stampmark{width:42px;height:42px;border-radius:50%;border:3px solid var(--stamp);color:var(--stamp);display:grid;place-items:center;font-family:var(--f-display);font-size:18px;transform:rotate(-12deg);flex:none}
.brand h1{font-size:25px;line-height:1.15}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);display:grid;gap:14px;min-width:0}
.lbl{font-weight:700;font-size:14px;display:block;margin-bottom:6px}
input.txt{width:100%;font:inherit;font-size:17px;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.tests{display:grid;gap:7px}
.revbox{display:grid;gap:6px;padding:12px 14px;border:2px solid var(--accent);border-radius:12px;background:var(--surface)}.revbox p{margin:0}
.books{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.books.wks{grid-template-columns:repeat(4,1fr)}.wkb{display:grid;gap:1px;line-height:1.2}.wkb small{font-size:11px;font-weight:600;opacity:.8}
.book{padding:12px 6px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font-weight:700;font-size:15px;cursor:pointer}
.book[aria-checked="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.resume{border:2px solid var(--accent);display:grid;gap:6px}.resume.pen{border-color:var(--bad)}.resume p{margin:0}.rbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}.rbtns .btn:only-child{grid-column:span 2}
.when{margin:10px 0 2px;padding:9px 12px;border-radius:10px;background:var(--surface-2);font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}.when b{font-size:17px;margin-left:4px}
.test{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center;text-align:left;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);cursor:pointer}
.test .num{grid-row:span 2;font-family:var(--f-display);font-size:22px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--muted)}
.test b{font-size:16px}
.test small{grid-column:2;color:var(--muted);font-size:13px}
.test .meta{grid-row:span 2;grid-column:3;font-size:12px;font-weight:700;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;line-height:1.3}
.test.pen{border-style:dashed}.test.pen .num{background:var(--bad-bg);color:var(--bad)}.test.pen[aria-checked="true"]{border-color:var(--bad)}.test.pen[aria-checked="true"] .num{background:var(--bad);color:var(--on-color)}
.test[aria-checked="true"]{border-color:var(--accent);background:var(--surface)}
.test[aria-checked="true"] .num{background:var(--accent);color:var(--accent-ink)}
.rules{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:14px;color:var(--muted)}
.rules b{color:var(--ink)}
.passrule,.passrule b{color:var(--stamp)}
.toggle{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--bg);font-weight:500;width:100%;text-align:left}
.toggle .sw{width:40px;height:24px;border-radius:12px;background:var(--surface-2);position:relative;flex:none;transition:background .2s}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
.toggle[aria-pressed="true"] .sw{background:var(--accent)}
.toggle[aria-pressed="true"] .sw::after{transform:translateX(16px);background:var(--accent-ink)}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:900;font-size:18px;cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:var(--surface-2);color:var(--ink);font-size:16px}
.hint{font-size:13px;color:var(--muted);margin:0}

.hud{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 0 6px}
.hud .prog{font-weight:700;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hud .score{font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums}
.combo{font-family:var(--f-display);font-size:17px;padding:2px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);visibility:hidden}
.combo.on{visibility:visible}
.combo.c3{background:var(--warn);color:var(--on-color)}
.combo.c5{background:var(--stamp);color:var(--on-color);animation:beat .5s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.timer{height:9px;border-radius:5px;background:var(--surface-2);overflow:hidden;margin-bottom:8px}
.timer i{display:block;height:100%;width:100%;background:var(--accent);border-radius:5px;transform-origin:left}
.timer.low i{background:var(--stamp)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);margin-bottom:8px;position:relative;min-width:0}
.kind{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--accent);margin-bottom:4px}
.prompt{font-size:17px;font-weight:500;overflow-wrap:anywhere}
.prompt.big{font-family:var(--f-display);font-weight:400;font-size:30px;text-align:center;padding:10px 0 6px;line-height:1.2}
.prompt.en{font-family:var(--f-en);font-weight:600;font-size:31px}
.prompt.ko{font-family:var(--f-body);font-weight:900;font-size:24px}
.prompt .pos{display:block;font-family:var(--f-body);font-size:13px;font-weight:700;color:var(--muted);margin-top:2px}
.prompt.sent{font-family:var(--f-en);font-size:19px;line-height:1.55;font-weight:500}
.prompt .oxs.ok{color:var(--good);font-weight:900;border-bottom:2.5px solid var(--good)}.prompt .oxs.no{color:var(--bad);font-weight:900}.prompt .oxs.no s{opacity:.7}
.prompt .gap{display:inline-block;min-width:4.2em;border-bottom:2.5px solid var(--accent);margin:0 2px;color:var(--accent);font-weight:900;text-align:center;font-family:var(--f-body)}
.prompt .ko-hint{display:block;font-family:var(--f-body);font-size:14px;color:var(--muted);margin-top:8px;font-weight:400;line-height:1.45}
.pt{display:inline-block;font-family:var(--f-body);font-size:12px;font-weight:700;padding:1px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted);margin-left:4px}
.opts{display:grid;gap:7px}
.opt{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);font-size:17px;font-weight:500;cursor:pointer;min-height:50px;overflow-wrap:anywhere;transition:transform .08s}
.opt:active{transform:scale(.98)}
.opt .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:13px;font-weight:900;color:var(--muted);font-family:var(--f-body)}
.opt .en{font-family:var(--f-en);font-weight:600;font-size:19px}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.right .n{background:var(--good);color:var(--on-color)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .n{background:var(--bad);color:var(--on-color)}
.opt:disabled{cursor:default}

/* 순서배열 */
.ko-q{font-weight:700;font-size:17px;line-height:1.5}
.tray{min-height:96px;border:2px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;margin-bottom:8px;background:var(--surface)}
.tray.empty::before{content:"아래 조각을 순서대로 누르세요";color:var(--muted);font-size:14px;padding:4px}
.bank{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{font-family:var(--f-en);font-size:17px;font-weight:500;padding:7px 11px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;line-height:1.25;max-width:100%;overflow-wrap:anywhere}
.chip:active{transform:scale(.97)}
.tray .chip{background:var(--surface-2);border-color:transparent}
.bank .chip.used{visibility:hidden}
.ordbtns{display:grid;grid-template-columns:1fr 2fr;gap:8px}
.fb{border-radius:12px;padding:10px 12px;font-size:15px;display:grid;gap:4px;margin-bottom:8px}
.fb.ok{background:var(--good-bg);color:var(--good);font-weight:700}
.fb.no{background:var(--bad-bg)}
.fb .h{color:var(--bad);font-weight:900}
.fb .en{font-family:var(--f-en);color:var(--ink);font-size:16px}
.fb .mine{font-family:var(--f-en);color:var(--muted);font-size:15px;text-decoration:line-through}

.float{position:absolute;right:14px;top:6px;font-family:var(--f-display);font-size:26px;color:var(--good);pointer-events:none;animation:up .9s ease-out forwards}
@keyframes up{from{opacity:0;transform:translateY(16px)}20%{opacity:1}to{opacity:0;transform:translateY(-34px)}}
.cheer{position:fixed;left:0;right:0;top:28%;text-align:center;font-family:var(--f-display);font-size:34px;color:var(--stamp);pointer-events:none;animation:pop 1.2s ease-out forwards;z-index:30;text-shadow:0 2px 0 var(--surface)}
@keyframes pop{0%{opacity:0;transform:scale(.5)}20%{opacity:1;transform:scale(1.15)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
#flash{position:fixed;inset:0;background:var(--bad);opacity:0;pointer-events:none;z-index:20}
#flash.go{animation:flash .45s ease-out}
@keyframes flash{0%{opacity:.35}100%{opacity:0}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:25;width:100%;height:100%}

.grade{display:flex;align-items:center;gap:16px}
.grade .g{font-family:var(--f-display);font-size:52px;line-height:1;width:78px;height:78px;border-radius:50%;border:5px solid currentColor;display:grid;place-items:center;transform:rotate(-10deg);flex:none}
.g-S{color:var(--gold)}.g-A{color:var(--good)}.g-B{color:var(--accent)}.g-C{color:var(--warn)}.g-D{color:var(--stamp)}
.which{font-size:13px;font-weight:700;color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--bg);border-radius:10px;padding:8px;text-align:center;min-width:0}
.stat b{display:block;font-family:var(--f-display);font-weight:400;font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.pass{display:flex;align-items:center;gap:12px;border-radius:12px;padding:12px 14px;background:var(--good-bg);color:var(--good);border:2px solid var(--good)}
.pass.fail{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.pass .big{font-family:var(--f-display);font-size:34px;line-height:1;flex:none}
.pass p{margin:0;font-size:14px;font-weight:700;color:var(--ink)}
.copyline{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px!important}
.cnt{display:block;font-size:12px;font-weight:700;color:var(--bad);margin-bottom:2px}
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.list li{padding:9px 2px;border-bottom:1px solid var(--line);display:grid;gap:3px;font-size:15px;min-width:0}
.list li b{overflow-wrap:anywhere}
.list .en{font-family:var(--f-en);font-size:16px}
.list .sub{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.list u{text-decoration-color:var(--accent);text-decoration-thickness:2px;font-weight:600}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;transition:none!important}}

/* 오답 노트 시험지 (화면 미리보기 + 인쇄) */
textarea.txt{width:100%;font:inherit;font-size:14px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);resize:vertical;min-height:140px}
.linkbtn{display:block;margin:6px auto 0;background:none;border:0;color:var(--muted);text-decoration:underline;font:inherit;font-size:14px;padding:10px;cursor:pointer}
.sbar{display:grid;gap:8px}
.sheets{display:grid;gap:14px;margin-top:12px}
.sheet{background:#fff;color:#141414;border-radius:8px;padding:20px 18px;font-size:14px;line-height:1.5;box-shadow:var(--shadow);min-width:0;overflow-wrap:anywhere}
.shead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-bottom:2px solid #141414;padding-bottom:6px;margin-bottom:8px;font-size:15px}
.sinfo{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;margin-bottom:6px}
.ssec h3{font-size:14px;margin:12px 0 4px;padding:4px 8px;background:#eef0f5;border-left:4px solid #2f4ad0}
.ssec h3 small{font-weight:400;color:#444;margin-left:4px}
.sq{break-inside:avoid;padding:6px 0 8px;border-bottom:1px dotted #bbb}
.sq p{margin:0}
.sen{font-family:var(--f-en)}
.sopts{list-style:none;margin:4px 0 0;padding:0 0 0 14px;display:grid;grid-template-columns:1fr 1fr;gap:2px 14px}
.stag{font-size:11px;color:#b3261e;border:1px solid #b3261e;border-radius:4px;padding:0 4px;margin-left:4px;white-space:nowrap}
.schunks{margin:5px 0 4px!important;padding:6px 8px;background:#f2f3f7;border-radius:4px;font-family:var(--f-en)}
.sline{border-bottom:1px solid #999;height:24px}
.keys{list-style:none;padding:0;margin:0;columns:2;column-gap:22px;font-size:13px}
.keys li{break-inside:avoid;padding:2px 0}
@media (max-width:440px){.sopts{grid-template-columns:1fr}}
@media print{
  @page{size:A4;margin:12mm}
  html,body{background:#fff!important}
  .noprint,#fx,#flash{display:none!important}
  #app{max-width:none!important;padding:0!important;margin:0!important}
  .sheets{display:block;margin:0}
  .sheet{box-shadow:none;padding:0;border-radius:0;break-after:page}
  .sopts{grid-template-columns:1fr 1fr!important}
}
</style>

/* 간격 반복(망각곡선): 틀린 단어는 1일 뒤 → 맞히면 3일 → 7일 → 14일 → 30일 뒤 다시. 복습에서 또 틀리면 1일부터 다시. 이 폰(브라우저)에만 저장 */
const SRS_INT=[1,3,7,14,30];
const SRSKEY=name=>"wt6-srs-g3-"+clean(name);
function dayStr(add){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+(add||0));const p=n=>String(n).padStart(2,"0");return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`}
function mdStr(s){const [,m,d]=s.split("-");return `${+m}월 ${+d}일`}
function srsLoad(name){try{const o=JSON.parse(localStorage.getItem(SRSKEY(name))||"{}");return o&&typeof o==="object"?o:{}}catch(e){return {}}}
function srsSave(name,o){try{localStorage.setItem(SRSKEY(name),JSON.stringify(o))}catch(e){}}
function srsQ(e){const D=ALL[e.l]&&ALL[e.l].data;const q=D&&D.ek.find(x=>x.word===e.w);return q?{...q,_t:"ek"}:null}
function srsDue(name){const t=dayStr(0);return Object.values(srsLoad(name)).filter(e=>e&&e.due<=t&&srsQ(e))}
function srsNext(name){const t=dayStr(0),f=Object.values(srsLoad(name)).filter(e=>e&&e.due>t).map(e=>e.due).sort();return f.length?{d:f[0],n:f.filter(x=>x===f[0]).length,all:f.length}:null}
function srsHit(q,ok){try{
  if(q._t!=="ek")return;const o=q._o||q;if(!o.lesson||!ALL[o.lesson])return;
  const S=srsLoad(G.name),k=o.word;
  if(!ok){S[k]={w:k,l:o.lesson,s:0,due:dayStr(SRS_INT[0]),miss:((S[k]&&S[k].miss)||0)+1}}
  else if(G.id==="rev"&&!G.retry&&S[k]){const s=S[k].s+1;if(s>=SRS_INT.length){delete S[k];G.mastered=(G.mastered||0)+1}else S[k]={...S[k],s,due:dayStr(SRS_INT[s])}}
  else return;
  srsSave(G.name,S);
}catch(e){}}
function revBox(name){

  return `<b>🔁 오늘의 복습</b><p class="hint">${nx?`오늘은 복습할 단어가 없어요. 다음 복습: <b>${mdStr(nx.d)}</b> ${nx.n}개 (예정 ${nx.all}개)`:"틀린 단어가 생기면 1·3·7·14·30일 뒤에 여기서 다시 보게 돼요."}</p>`;
}

function tone(freq,start,dur,type="sine",vol=.18){const c=ac();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(freq,c.currentTime+start);g.gain.setValueAtTime(0,c.currentTime+start);g.gain.linearRampToValueAtTime(vol,c.currentTime+start+.01);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+start+dur);o.connect(g);g.connect(c.destination);o.start(c.currentTime+start);o.stop(c.currentTime+start+dur+.05)}

/* confetti */
const cv=$("#fx"),cx=cv.getContext("2d");let parts=[],raf=0;
function sizeCv(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio}
addEventListener("resize",sizeCv);sizeCv();
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function confetti(n,x,y,spread){if(reduce)return;const cols=["#2f4ad0","#d8382c","#ef7d16","#1c9a57","#d79b00","#9b5de5"];const d=devicePixelRatio;for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=(2+Math.random()*spread)*d;parts.push({x:x*d,y:y*d,vx:Math.cos(a)*s,vy:Math.sin(a)*s-4*d,w:(5+Math.random()*5)*d,h:(3+Math.random()*4)*d,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[i%cols.length],life:60+Math.random()*50})}if(!raf)raf=requestAnimationFrame(tick)}
function tick(){cx.clearRect(0,0,cv.width,cv.height);const d=devicePixelRatio;parts=parts.filter(p=>p.life>0);for(const p of parts){p.vy+=.18*d;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life--;cx.save();cx.globalAlpha=Math.min(1,p.life/30);cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore()}raf=parts.length?requestAnimationFrame(tick):0}
function bigConfetti(){const w=innerWidth;for(let k=0;k<4;k++)setTimeout(()=>{confetti(90,w*(.2+.6*Math.random()),innerHeight*.35,9)},k*260)}

/* game */
function pickWrong(q){const p=q.pool||[];if(p.length<3)return q.fixed;const bad=new Set((q.clash||[]).map(([i,j])=>i+"-"+j));const out=q.traps?[0]:[];for(const i of shuffle(p.map((_,k)=>k)).filter(i=>!out.includes(i))){if(out.every(j=>!bad.has(Math.min(i,j)+"-"+Math.max(i,j))))out.push(i);if(out.length===3)break}return out.length===3?out.map(i=>p[i]):q.fixed}
function draw(t){
  const out=[];
  for(const [s,n,pools] of t.parts){
    if(pools){const seen=new Set(out.filter(q=>q._t===s).map(q=>q.word));out.push(...shuffle(pools.flatMap(k=>DATA[k])).filter(q=>!q.word||(!seen.has(q.word)&&seen.add(q.word))).slice(0,n).map(q=>({...q,_t:s})));continue} // 같은 단어가 두 은행에 있어도 한 번만
    let src=poolOf(s);
    if(t.pen&&META.penMix&&typeof ALL!=="undefined"){ // 준호(11/02): 패널티 단어·동반혼은 과 은행 절반 + 올림포스 절반
      const mix=META.penMix.flatMap(k=>{const D=ALL[k].data;return s==="sac"?[...D.sac1,...D.sac2]:(D[s]||[])});
      if(mix.length){const h=Math.ceil(n/2);out.push(...[...shuffle(src).slice(0,h),...shuffle(mix).slice(0,n-h)].map(q=>({...q,_t:s})));continue}
    }
    if((s==="ek"||s==="ke")&&t.parts.some(([x])=>x==="ek")&&t.parts.some(([x])=>x==="ke")){ // 같은 시험에서 영→한과 한→영이 같은 단어를 묻지 않게
      if(!G0.words){const w=shuffle(DATA.ek.map(q=>q.word));G0.words={ek:new Set(w.slice(0,Math.ceil(w.length/2))),ke:new Set(w.slice(Math.ceil(w.length/2)))}}
      const half=src.filter(q=>G0.words[s].has(q.word));if(half.length>=n)src=half;
    }
    out.push(...shuffle(src).slice(0,n).map(q=>({...q,_t:s})));
  }
  return out;
}
let G0={};
function prepOne(q,flag){
  const s=q._t;
  if(s==="ek"||s==="ke"||s==="sac"){const opts=shuffle([q.ans,...pickWrong(q)]);return{...q,_o:q,opts,ans:opts.indexOf(q.ans),key:q.ans}}
  if(s==="order"){let b;do{b=shuffle(q.chunks.map((c,i)=>i))}while(b.every((v,i)=>v===i)&&q.chunks.length>1);return{...q,_o:q,bank:b}}
  if(s==="gox"){const right=flag===undefined?Math.random()<.5:flag,used=right?q.answer:shuffle(q.wrong)[0];return{...q,_o:q,used,right,opts:["O  어법상 맞다","X  어법상 틀리다"],ans:right?0:1}}
  const opts=shuffle([q.answer,...q.wrong]);return{...q,_o:q,opts,ans:opts.indexOf(q.answer)};
}
function prep(id,list){
  G0={};const items=list||draw(T(id));
  const order=[...new Set(TESTS.find(t=>t.id===id).parts.map(([s])=>s))];
  const qs=order.flatMap(s=>shuffle(items.filter(q=>q._t===s)));
  const ng=qs.filter(q=>q._t==="gox").length,flags=shuffle([...Array(ng)].map((_,i)=>i<Math.round(ng/2)));let fi=0; // 어법 OX는 O·X 반반
  return qs.map(q=>prepOne(q,q._t==="gox"?flags[fi++]:undefined));
}
let G=null,tmr=0,t0=0,locked=false;

function resumeG(s){
  if(s.pending)return startGame(s.name,s.id,s.pending);

function startGame(name,id,list){

function runTimer(onEnd){
  const tt=SUB[G.qs[G.i]._t].time,total=tt*1000,bar=$("#bar"),tm=$("#timer");

  $("#opts").querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.k));

const CHEERS={3:"좋아요! 3연속 🔥",5:"불붙었다! 5연속",7:"멈출 수 없어! 7연속",10:"전설의 10연속!"};
function scoreIt(ok,anchor){
  const total=SUB[G.qs[G.i]._t].time*1000,left=Math.max(0,total-(performance.now()-t0));
  if(ok){
    srsHit(G.qs[G.i],true);G.combo++;G.correct++;G.maxCombo=Math.max(G.maxCombo,G.combo);
    const gain=100+Math.round(left/total*100)+Math.min((G.combo-1)*50,250);G.score+=gain;
    const f=document.createElement("div");f.className="float";f.textContent="+"+gain;$("#card").appendChild(f);
    if(anchor){const r=anchor.getBoundingClientRect();confetti(26,r.left+r.width/2,r.top+r.height/2,4)}sfxRight(G.combo);
    if(CHEERS[G.combo]||(G.combo>10&&G.combo%5===0)){const c=document.createElement("div");c.className="cheer";c.textContent=CHEERS[G.combo]||`${G.combo}연속! 대단해요`;document.body.appendChild(c);setTimeout(()=>c.remove(),1300)}
  }else{
    G.combo=0;G.wrong.push(G.qs[G.i]);noteAdd(G.qs[G.i]);srsHit(G.qs[G.i],false);
    app.classList.remove("shake");void app.offsetWidth;app.classList.add("shake");
    const fl=$("#flash");fl.classList.remove("go");void fl.offsetWidth;fl.classList.add("go");sfxWrong();
  }
  $("#score").textContent=G.score.toLocaleString();
  const cb=$("#combo");cb.textContent=`COMBO ×${G.combo}`;cb.classList.toggle("on",G.combo>=2);cb.classList.toggle("c3",G.combo>=3&&G.combo<5);cb.classList.toggle("c5",G.combo>=5);
}
function next(){G.i++;G.i<G.qs.length?showQ():renderResult()}
function answer(k){
  if(locked)return;locked=true;cancelAnimationFrame(tmr);
  const q=G.qs[G.i],ok=k===q.ans;
  const btns=[...$("#opts").children];btns.forEach(b=>b.disabled=true);
  btns[q.ans].classList.add("right");if(!ok&&k>=0)btns[k].classList.add("wrong");
  const gp=$(".prompt .gap");if(gp)gp.textContent=q.answer;
  const ox=$(".prompt .oxs");if(ox){ox.classList.add(q.right?"ok":"no");ox.innerHTML=q.right?esc(q.answer):`<s>${esc(q.used)}</s> → ${esc(q.answer)}`;$(".prompt.sent").insertAdjacentHTML("beforeend",`<span class="ko-hint" lang="ko">${esc(q.point||"")}</span>`)}
  if(q._t==="vocab"){const s=$(".prompt.sent");if(s)s.insertAdjacentHTML("beforeend",`<span class="ko-hint" lang="ko">${esc(q.ko)}</span>`)}
  scoreIt(ok,ok?btns[k]:null);
  const slow=q._t==="vocab"||q._t==="gram"||q._t==="gox";
  setTimeout(next,ok?(slow?900:650):(slow?2600:(k<0?1900:1700)));
}

/* 순서배열 */
function showOrder(q){
  q.placed=[];
  $("#card").innerHTML=`<div class="kind">서술형 순서배열 · ${META.lessonName[q.lesson]}<span class="pt">${esc(q.point)}</span></div><div class="ko-q">${esc(q.ko)}</div>`;
  $("#area").innerHTML=`<div class="tray empty" id="tray" aria-label="내가 만든 문장"></div><div class="bank" id="bank">${q.bank.map(i=>`<button class="chip" lang="en" data-i="${i}">${esc(q.chunks[i])}</button>`).join("")}</div><div class="ordbtns"><button class="btn ghost" id="undo">하나 빼기</button><button class="btn" id="sub" disabled>제출하기</button></div>`;
  const tray=$("#tray"),sub=$("#sub");
  const draw=()=>{tray.innerHTML=q.placed.map((i,p)=>`<button class="chip" lang="en" data-p="${p}">${esc(q.chunks[i])}</button>`).join("");tray.classList.toggle("empty",!q.placed.length);
    $("#bank").querySelectorAll(".chip").forEach(b=>b.classList.toggle("used",q.placed.includes(+b.dataset.i)));
    sub.disabled=q.placed.length!==q.chunks.length;
    tray.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{if(locked)return;q.placed.splice(+b.dataset.p,1);sfxTap();draw()})};
  $("#bank").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{if(locked)return;const i=+b.dataset.i;if(q.placed.includes(i))return;q.placed.push(i);sfxTap();draw();if(q.placed.length===q.chunks.length)sub.focus()});
  $("#undo").onclick=()=>{if(locked)return;q.placed.pop();draw()};
  sub.onclick=()=>submitOrder(q);
  draw();
  runTimer(()=>submitOrder(q,true));
}
function submitOrder(q,timeout){
  if(locked)return;locked=true;cancelAnimationFrame(tmr);
  const mine=q.placed.map(i=>q.chunks[i]).join(" "),ok=mine===q.sentence;
  q.mine=mine;
  $("#bank").innerHTML="";
  $("#area").querySelector(".ordbtns").remove();
  scoreIt(ok,$("#tray"));
  const fb=document.createElement("div");
  fb.className="fb "+(ok?"ok":"no");
  fb.innerHTML=ok?`정답이에요!`:`<span class="h">${timeout?"시간 초과":"틀렸어요"}</span>${mine?`<span class="mine" lang="en">${esc(mine)}</span>`:""}<span class="en" lang="en">${esc(q.sentence)}</span>`;
  $("#area").appendChild(fb);
  if(ok){setTimeout(next,1300)}
  else{const b=document.createElement("button");b.className="btn";b.textContent=G.i+1<G.qs.length?"다음 문제":"결과 보기";b.onclick=next;$("#area").appendChild(b);b.focus()}
}

/* result */
function stamp(){const d=new Date(),p=n=>String(n).padStart(2,"0");return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`}
function clean(s){return String(s).replace(/[|,]/g," ").replace(/\s+/g," ").trim()}
function wrongKey(q){const s=q._t;return s==="ek"?"영한:"+clean(q.word):s==="ke"?"한영:"+clean(q.word):s==="sac"?"동반혼:"+clean(q.word):s==="order"?"배열"+q.id:(s==="gram"?"문법#":s==="gox"?"어법OX#":"어휘#")+q.id+" "+clean(q.answer)}
/* 오답 노트: 이름별·과별로 이 기기에 계속 쌓임 (재시험·연습에서 틀린 것도) */

function noteAdd(q){try{const o=q._o||q,k=o._t+":"+(o.word||o.id),n=noteLoad(G.name),e=n[k]||{q:o,c:0};e.c++;e.last=stamp();e.from=G.t.name+(G.retry?" 오답재시험":"");n[k]=e;localStorage.setItem(NKEY(G.name),JSON.stringify(n))}catch(e){}}
function renderNote(name){

   <header class="brand"><div class="stampmark">원탑</div><div><h1>📒 ${esc(name)}의 오답 노트</h1><p>${esc(META.short)} · 지금까지 틀린 문제 ${es.length}개 (재시험에서 틀린 것 포함)</p></div></header>
   ${es.length?`<button class="btn" id="prac">오답 노트 ${es.length}문제 다시 풀기</button><button class="btn ghost" id="npr">🖨 시험지로 인쇄 · PDF 저장</button>`:""}
   ${groups.map(([s,a])=>`<div class="panel"><h2>${SUB[s].label} ${a.length}개</h2><ul class="list">${a.map(e=>wrongLi(e.q).replace("<li>",`<li><span class="cnt">${e.c}번 틀림 · 마지막 ${esc(e.last)}</span>`)).join("")}</ul></div>`).join("")||`<div class="panel"><p class="hint">아직 틀린 문제가 없어요. 시험을 풀면 틀린 문제가 여기에 계속 쌓여요.</p></div>`}
   ${es.length?`<div class="panel"><button class="btn" id="ncp">오답 노트 복사해서 선생님께 보내기</button><input class="txt copyline" id="nline" readonly value="${esc(line)}" aria-label="선생님께 보낼 오답 노트"></div>`:""}
   <button class="btn ghost" id="nback">돌아가기</button></div>`;
  scrollTo(0,0);
  if($("#prac"))$("#prac").onclick=()=>{ac();startGame(name,"note",es.map(e=>e.q))};
  if($("#npr"))$("#npr").onclick=()=>showSheets(sheetOne(META,name,stamp(),es),()=>renderNote(name));
  if($("#ncp"))$("#ncp").onclick=async e=>{const b=e.currentTarget,inp=$("#nline");inp.select();let ok=false;try{await navigator.clipboard.writeText(line);ok=true}catch(err){try{ok=document.execCommand("copy")}catch(e2){}}b.textContent=ok?"복사됨 ✓":"아래 칸을 길게 눌러 복사하세요"};
  $("#nback").onclick=renderStart;
}

/* 오답 노트 시험지: 학생(내 오답 노트) · 선생님(학생이 보낸 복사 줄 붙여넣기) 둘 다 */
const SH_ORDER=["ek","ke","sac","vocab","gram","order"];
const SH_HEAD={ek:"영어의 뜻으로 알맞은 것을 고르시오.",ke:"뜻에 알맞은 영어를 고르시오.",sac:"단어의 뜻으로 알맞은 것을 고르시오.",vocab:"빈칸에 들어갈 알맞은 어휘를 고르시오.",gram:"빈칸에 들어갈 어법상 알맞은 것을 고르시오.",order:"우리말과 같은 뜻이 되도록 주어진 말을 배열하시오."};
function sheetOne(meta,name,date,es){
  es=es.map(e=>({c:e.c,q:prepOne({...e.q,_t:e.q._t==="gox"?"gram":e.q._t})}));
  let no=0;const keys=[];
  const secs=SH_ORDER.map(s=>[s,es.filter(e=>e.q._t===s).sort((a,b)=>b.c-a.c)]).filter(([,a])=>a.length).map(([s,a])=>`<section class="ssec"><h3>${SUB[s].label}<small>${a.length}문제 · ${SH_HEAD[s]}</small></h3>${a.map(({q,c})=>{
    no++;const tag=c>1?`<span class="stag">${c}번 틀림</span>`:"";
    if(s==="order"){keys.push([no,q.sentence]);return `<div class="sq"><p><b>${no}.</b> ${esc(q.ko)}${tag}</p><p class="schunks" lang="en">${q.bank.map(i=>esc(q.chunks[i])).join(" / ")}</p><p class="sline"></p><p class="sline"></p></div>`}
    keys.push([no,NUMS[q.ans]+" "+q.opts[q.ans]]);
    const stem=s==="ek"||s==="sac"?`<b class="sen" lang="en">${esc(q.word)}</b>${q.type?` <small>${esc(q.type)}</small>`:""}${s==="sac"?` <small>(${esc(q.kind)})</small>`:""}`
      :s==="ke"?`<b>${esc(q.meaning)}</b>${q.type?` <small>${esc(q.type)}</small>`:""}`
      :`<span class="sen" lang="en">${gapSent(q.sent,"__________")}</span>${s==="gram"?`<br><small>${esc(q.ko)}</small>`:""}`;
    const en=s!=="ek"&&s!=="sac";
    return `<div class="sq"><p><b>${no}.</b> ${stem}${tag}</p><ol class="sopts">${q.opts.map((o,k)=>`<li${en?' class="sen" lang="en"':""}>${NUMS[k]} ${esc(o)}</li>`).join("")}</ol></div>`}).join("")}</section>`).join("");
  return `<article class="sheet"><div class="shead"><b>원탑영어학원 · ${esc(meta.short)} 오답 노트 시험지</b><span>${no}문제</span></div><div class="sinfo"><span>이름: <b>${esc(name)}</b></span><span>오답 기록: ${esc(date)}</span><span>점수: ______ / ${no}</span></div>${secs}</article>
  <article class="sheet"><div class="shead"><b>정답 · ${esc(meta.short)} 오답 노트</b><span>${esc(name)}</span></div><ol class="keys">${keys.map(([n,a])=>`<li><b>${n}.</b> ${esc(a)}</li>`).join("")}</ol></article>`;
}
function showSheets(html,back,warn){
  app.innerHTML=`<div class="noprint sbar"><button class="btn" id="sprint">🖨 인쇄 / PDF로 저장</button><p class="hint" id="shint">인쇄 창에서 프린터를 고르거나 ‘PDF로 저장’을 고르세요. 시험지 다음 쪽에 정답이 있어요.</p>${warn||""}<button class="btn ghost" id="sback">돌아가기</button></div><div class="sheets">${html}</div>`;
  scrollTo(0,0);
  $("#sback").onclick=back;
  $("#sprint").onclick=()=>{let ok=false;const f=()=>{ok=true};addEventListener("beforeprint",f);try{window.print()}catch(e){}setTimeout(()=>{removeEventListener("beforeprint",f);if(!ok)$("#shint").textContent="여기서는 인쇄 창이 열리지 않았어요. 컴퓨터 크롬에서 이 링크를 열고 다시 눌러 보세요."},900)};
}
function lessons(){return typeof ALL!=="undefined"?Object.values(ALL):[{meta:META,data:DATA}]}
function findKey(D0,k,mix){
  for(const D of [D0,...(mix||[])]){const q=findKey1(D,k);if(q)return q}return null;
}
function findKey1(D,k){
  let m;const w=s=>x=>clean(x.word)===s.trim();
  if(m=k.match(/^영한:(.+)$/)){const q=D.ek.find(w(m[1]));return q&&{...q,_t:"ek"}}
  if(m=k.match(/^한영:(.+)$/)){const q=D.ke.find(w(m[1]));return q&&{...q,_t:"ke"}}
  if(m=k.match(/^동반혼:(.+)$/)){const q=[...D.sac1,...D.sac2].find(w(m[1]));return q&&{...q,_t:"sac"}}
  if(m=k.match(/^배열(\d+)/)){const q=D.order.find(x=>x.id==m[1]);return q&&{...q,_t:"order"}}
  if(m=k.match(/^(문법|어법OX|어휘)#(\d+)/)){const s=m[1]==="어휘"?"vocab":"gram",q=D[s].find(x=>x.id==m[2]);return q&&{...q,_t:s}}
  return null;
}
function parseNoteLines(txt){
  const out=[],bad=[];
  for(const ln of txt.split(/\n+/)){
    const p=ln.split("|").map(s=>s.trim()),i=p.indexOf("오답노트");if(i<1)continue;
    const L=p[i-1]==="원탑고3"?g3All():lessons().find(x=>x.meta.code===p[i-1]);if(!L){bad.push(`${p[i+1]||"?"}: 이 링크에 없는 과의 줄이에요 (${p[i-1]})`);continue}
    const es=[];let miss=0;
    for(const raw of (p[i+4]||"").split(",")){const s=raw.trim();if(!s)continue;const mm=s.match(/^(.*?)(?:×(\d+))?$/),q=findKey(L.data,mm[1].trim(),(L.meta.penMix||[]).map(k=>ALL[k].data));if(q)es.push({q,c:+(mm[2]||1)});else miss++}
    if(miss)bad.push(`${p[i+1]}: 찾지 못한 문제 ${miss}개는 빠졌어요`);
    if(es.length)out.push({meta:L.meta,name:p[i+1]||"",date:p[i+2]||"",es});else bad.push(`${p[i+1]||"?"}: 틀린 문제가 없어요`);
  }
  return {out,bad};
}
function renderTeacher(prev){
  app.innerHTML=`<div style="display:grid;gap:12px"><header class="brand"><div class="stampmark">원탑</div><div><h1>선생님용 · 오답 노트 시험지</h1><p>학생들이 보낸 ‘오답노트’ 줄을 붙여 넣으면 학생마다 시험지 1장 + 정답 1장을 만들어요.</p></div></header>
  <div class="panel"><label class="lbl" for="tx">학생들이 보낸 줄 (여러 명이면 한 줄에 한 명씩, 한꺼번에 붙여 넣어도 돼요)</label><textarea class="txt" id="tx" rows="8" placeholder="${esc(META.code)}|오답노트|이름|날짜|개수|..."></textarea><button class="btn" id="mk">시험지 만들기</button><p class="hint" id="terr" role="status"></p></div>
  <button class="btn ghost" id="tback">돌아가기</button></div>`;
  const tx=$("#tx");tx.value=prev||"";scrollTo(0,0);
  $("#tback").onclick=renderStart;
  $("#mk").onclick=()=>{const v=tx.value,{out,bad}=parseNoteLines(v);
    if(!out.length){$("#terr").textContent=bad[0]||"‘오답노트’가 들어 있는 줄을 찾지 못했어요. 학생이 📒 오답 노트에서 복사한 줄을 붙여 넣어 주세요.";return}
    showSheets(out.map(o=>sheetOne(o.meta,o.name,o.date,o.es)).join(""),()=>renderTeacher(v),`<p class="hint"><b>${out.length}명</b> 시험지를 만들었어요.${bad.length?" "+bad.map(esc).join(" · "):""}</p>`)};
}
function wrongLi(q){
  if(q._t==="ek"||q._t==="ke")return `<li><b class="en" lang="en">${esc(q.word)}</b><span class="sub">${esc(q.type)} · ${esc(q.meaning)}</span></li>`;
  if(q._t==="sac")return `<li><b class="en" lang="en">${esc(q.word)}</b><span class="sub">${esc(q.kind)} (본문 ${esc(q.head)}) · ${esc(q.meaning)}</span></li>`;
  if(q._t==="order")return `<li><b>${q.id}. ${esc(q.ko)}</b><span class="en" lang="en">${esc(q.sentence)}</span><span class="sub">${esc(q.point)}</span></li>`;
  return `<li><span class="en" lang="en">${q.id}. ${gapSent(q.sent,"<u>"+esc(q.answer)+"</u>")}</span><span class="sub">${q._t==="gox"?(q.right?"맞는 문장(O)이었어요 · ":`틀린 문장(X): ${esc(q.used)} → ${esc(q.answer)} · `):""}${esc(q.ko)}${q.point?` · <b>${esc(q.point)}</b>`:""}</span></li>`;
}
function renderResult(){
  const n=G.qs.length,pct=G.correct/n,t=G.t;
  const grade=G.correct===n?"S":pct>=.8?"A":pct>=.6?"B":pct>=.4?"C":"D";
  let label={S:"만점! 완벽해요",A:"아주 잘했어요",B:"좋아요, 조금만 더",C:"틀린 문제를 다시 보세요",D:"다시 도전해 봐요"}[grade];
  const pm=G.retry?RETRY_MAX:passMax(G.t),passed=G.wrong.length<=pm,when=stamp();
  clearG();if(t.pen&&!passed)savePending(G.wrong.map(q=>q._o)); // 패널티는 통과 전까지 재시험이 남아 있음
  if(!passed&&(grade==="S"||grade==="A"))label="아깝다! 조금만 더";
  const line=[META.code,t.name.replace(/\s/g,"")+(G.retry?"(오답재시험)":""),clean(G.name),G.correct,n,when,G.wrong.length,G.wrong.map(wrongKey).join(","),passed?"통과":"재시험"].join("|");
  app.innerHTML=`<div style="display:grid;gap:12px">
   <div class="panel">
    <div class="grade"><div class="g g-${grade}">${grade}</div><div><div class="which">${t.id==="rev"?"🔁":NUMS[TESTS.indexOf(t)]} ${esc(t.name)}${G.retry?" · 틀린 문제 재시험":""} · ${esc(META.short)}</div><h2>${esc(G.name)} · ${label}</h2><p class="hint">${G.correct} / ${n} 정답 (${Math.round(pct*100)}%)</p></div></div>
    <div class="when">📅 응시 날짜 <b>${when}</b></div>${srsResult()}
    <div class="pass${passed?"":" fail"}"><span class="big">${passed?"통과":"재시험"}</span><p>틀린 개수 ${G.wrong.length}개 · 통과 기준 ${pm?pm+"개 이하":"모두 맞히기"}${passed?"":`<br>${G.wrong.length-pm}개 더 맞혀야 통과예요.`}${!passed&&t.pen?`<br><b>통과할 때까지 틀린 것만 다시 풀어야 해요.</b>`:""}</p></div>
    <div class="stats"><div class="stat"><b>${G.score.toLocaleString()}</b><span>게임 점수</span></div><div class="stat"><b>${G.correct}/${n}</b><span>맞힌 문제</span></div><div class="stat"><b>×${G.maxCombo}</b><span>최고 콤보</span></div></div>
    <button class="btn" id="cp">결과 복사해서 선생님께 보내기</button>
    <input class="txt copyline" id="line" readonly value="${esc(line)}" aria-label="선생님께 보낼 결과">
    <p class="hint">자동 복사가 안 되면 위 칸을 길게 눌러 전체 선택한 뒤 복사하세요.</p>
   </div>
   <div class="panel"><h2>틀린 문제 ${G.wrong.length}개</h2>${G.wrong.length?`<ul class="list">${G.wrong.map(wrongLi).join("")}</ul>`:`<p class="hint">틀린 문제가 없어요.</p>`}</div>
   ${G.wrong.length?`<button class="btn" id="retry">틀린 ${G.wrong.length}문제만 다시 풀기</button>`:""}
   ${(t.pen&&!passed)||t.id==="rev"?"":`<button class="btn${G.wrong.length?" ghost":""}" id="again">${esc(t.name)} 전체 다시 풀기</button>`}
   ${t.pen&&!passed?"":`<button class="btn ghost" id="home">다른 시험 고르기</button>`}</div>`;
  scrollTo(0,0);
  const inp=$("#line");inp.onclick=inp.onfocus=()=>{inp.select();inp.setSelectionRange(0,inp.value.length)};
  $("#cp").onclick=async e=>{const b=e.currentTarget;inp.select();inp.setSelectionRange(0,inp.value.length);let ok=false;try{await navigator.clipboard.writeText(line);ok=true}catch(err){try{ok=document.execCommand("copy")}catch(e2){}}b.textContent=ok?"복사됨 ✓":"아래 칸을 길게 눌러 복사하세요"};
  if($("#retry"))$("#retry").onclick=()=>startGame(G.name,G.id,G.wrong.map(q=>q._o));
  if($("#again"))$("#again").onclick=()=>startGame(G.name,G.id);
  if($("#home"))$("#home").onclick=renderStart;
  if(passed){bigConfetti();sfxFanfare()}
}
/* 저장 데이터가 꼬여서 첫 화면이 안 뜨면: 이 과 저장만 지우고 다시 그림 */ try{renderStart()}catch(e){try{clearG();localStorage.removeItem(META.key+"-test");pick=TESTS[0].id;renderStart()}catch(e2){app.innerHTML='<div class="panel"><p>화면을 여는 중 문제가 생겼어요.</p><button class="btn" onclick="try{Object.keys(localStorage).filter(k=>k.indexOf(\'wt\')===0&&k.indexOf(\'-note-\')<0).forEach(k=>localStorage.removeItem(k))}catch(e){}location.reload()">저장 지우고 다시 열기</button></div>'}}

;window.__otReady=1;
</script>
